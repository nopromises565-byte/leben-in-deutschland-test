<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verben konjugieren – Test in Deutschland</title><style>:root{--g:#08764d;--ink:#102238;--line:#d9e6e0}*{box-sizing:border-box}body{margin:0;background:#f6faf8;color:var(--ink);font-family:Arial,sans-serif}.top{background:#fff;border-bottom:1px solid #e7eeea}.topin{max-width:900px;margin:auto;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:950;color:var(--ink);text-decoration:none}.back{background:var(--g);color:#fff;text-decoration:none;padding:9px 13px;border-radius:22px;font-weight:900}.hero{background:linear-gradient(110deg,#056342,#087b51);color:#fff;padding:34px 18px;text-align:center}.hero h1{margin:0 0 8px;font-size:2rem}.wrap{max-width:720px;margin:22px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 7px 22px #1022380d}.card label{font-weight:900;display:block;margin-bottom:9px}.row{display:flex;gap:8px}.row input{flex:1;border:1px solid #cfded7;border-radius:14px;padding:13px;font-size:1rem;outline:none}.row button{border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:900;padding:0 18px}.hint{color:#66766e;font-size:.86rem;margin:10px 2px 18px}.result{display:none}.result.show{display:block}.verb-title{text-align:center;font-size:1.65rem;color:var(--g);font-weight:950;margin:10px 0 18px}.conj{width:100%;border-collapse:collapse}.conj td{padding:11px;border-bottom:1px solid #e7eeea}.conj td:first-child{font-weight:900;width:38%}.empty{padding:18px;text-align:center;color:#687870;background:#f7faf8;border-radius:14px}.examples{margin-top:18px;background:#edf7f2;border-radius:14px;padding:14px}.examples strong{display:block;margin-bottom:7px}.footer{text-align:center;padding:28px 16px;font-size:.8rem}.footer a{color:inherit}@media(max-width:520px){.hero h1{font-size:1.65rem}.card{padding:17px}.row{display:block}.row button{width:100%;padding:12px;margin-top:8px}}</style></head><body><header class="top"><div class="topin"><a class="logo" href="index.html">📖 Test in Deutschland</a><a class="back" href="index.html">← Start</a></div></header><section class="hero"><h1>✍️ Verben konjugieren</h1><div>Verb eingeben und sofort die Formen sehen</div></section><main class="wrap"><section class="card"><label for="verbInput">Welches Verb möchtest du konjugieren?</label><div class="row"><input id="verbInput" placeholder="z. B. gehen, machen, sein …" autocomplete="off"><button id="goBtn">Konjugieren</button></div><div class="hint">Präsens: ich · du · er/sie/es · wir · ihr · sie/Sie</div><div id="result" class="result"></div></section></main><footer class="footer"><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></footer><script>const irregular={sein:['bin','bist','ist','sind','seid','sind'],haben:['habe','hast','hat','haben','habt','haben'],werden:['werde','wirst','wird','werden','werdet','werden'],gehen:['gehe','gehst','geht','gehen','geht','gehen'],fahren:['fahre','fährst','fährt','fahren','fahrt','fahren'],lesen:['lese','liest','liest','lesen','lest','lesen'],sehen:['sehe','siehst','sieht','sehen','seht','sehen'],sprechen:['spreche','sprichst','spricht','sprechen','sprecht','sprechen'],essen:['esse','isst','isst','essen','esst','essen'],nehmen:['nehme','nimmst','nimmt','nehmen','nehmt','nehmen'],geben:['gebe','gibst','gibt','geben','gebt','geben'],helfen:['helfe','hilfst','hilft','helfen','helft','helfen'],schlafen:['schlafe','schläfst','schläft','schlafen','schlaft','schlafen'],laufen:['laufe','läufst','läuft','laufen','lauft','laufen'],tragen:['trage','trägst','trägt','tragen','tragt','tragen'],wissen:['weiß','weißt','weiß','wissen','wisst','wissen'],können:['kann','kannst','kann','können','könnt','können'],müssen:['muss','musst','muss','müssen','müsst','müssen'],wollen:['will','willst','will','wollen','wollt','wollen'],dürfen:['darf','darfst','darf','dürfen','dürft','dürfen'],sollen:['soll','sollst','soll','sollen','sollt','sollen'],mögen:['mag','magst','mag','mögen','mögt','mögen']};const pron=['ich','du','er / sie / es','wir','ihr','sie / Sie'];function regular(v){if(!v.endsWith('en')&&!v.endsWith('n'))return null;let stem=v.endsWith('en')?v.slice(0,-2):v.slice(0,-1);let ep=/[dt]$/.test(stem);let sibilant=/[sxzß]$/.test(stem);return[stem+'e',stem+(ep?'est':sibilant?'t':'st'),stem+(ep?'et':'t'),v,stem+(ep?'et':'t'),v]}function show(){let v=document.getElementById('verbInput').value.trim().toLowerCase();let out=document.getElementById('result');if(!v){out.className='result';out.innerHTML='';return}let forms=irregular[v]||regular(v);if(!forms){out.className='result show';out.innerHTML='<div class="empty">Bitte gib ein Verb in der Grundform ein, z. B. <b>lernen</b>.</div>';return}out.className='result show';out.innerHTML='<div class="verb-title">'+v+'</div><table class="conj">'+pron.map((p,i)=>'<tr><td>'+p+'</td><td>'+forms[i]+'</td></tr>').join('')+'</table>'+(irregular[v]?'<div class="examples"><strong>Merke:</strong>Dieses Verb hat besondere Formen. Lerne besonders <b>du</b> und <b>er/sie/es</b>.</div>':'<div class="examples"><strong>Regelmäßiges Verb</strong>Die Endungen folgen der normalen Präsens-Regel.</div>')}document.getElementById('goBtn').addEventListener('click',show);document.getElementById('verbInput').addEventListener('input',show);document.getElementById('verbInput').addEventListener('keydown',e=>{if(e.key==='Enter')show()});</script></body></html>
