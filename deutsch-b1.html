<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch B1 lernen</title><link rel="stylesheet" href="styles.css"><style>:root{--g:#08784f;--g2:#0a9460;--ink:#10243b;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink)}.top{background:#fff;border-bottom:1px solid #e5ece8}.topin,.wide{max-width:1240px;margin:auto;padding-left:18px;padding-right:18px}.topin{min-height:62px;display:flex;align-items:center;gap:18px}.logo{font-size:1.12rem;font-weight:950;color:var(--ink);text-decoration:none}.navtabs{display:flex;gap:3px;margin:auto}.navtabs a{padding:8px 16px;border-radius:22px;text-decoration:none;color:var(--ink);font-weight:900}.navtabs .active{background:var(--g);color:#fff}.hero{height:205px;background:linear-gradient(105deg,#066846,#159465);color:#fff}.hero .wide{padding-top:50px}.hero h1{font-size:2.75rem;margin:0;font-weight:950;line-height:1}.hero h1 b{color:#ffd33e}.hero p{margin:12px 0 0;font-size:1.08rem;font-weight:850;max-width:820px;color:#fff;line-height:1.35;text-shadow:0 1px 2px rgba(0,0,0,.18)}.dashboard{margin-top:10px}.summary{position:relative;z-index:2;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px #14392d12;padding:14px 18px;display:grid;grid-template-columns:1.55fr repeat(3,1fr);align-items:center}.sum{padding:8px 18px;border-left:1px solid #e5ece8}.sum:first-child{border-left:0}.sum strong{font-size:1.15rem;display:block}.progress-track,.mini-track{background:#e5ece9;border-radius:99px;overflow:hidden}.progress-track{height:8px;margin-top:7px}.progress-fill,.mini-fill{height:100%;background:var(--g2)}.course{margin:14px 0 30px}.chapter{display:grid;grid-template-columns:135px 1fr;border:1px solid var(--line);background:#fff;border-radius:21px;margin:12px 0;overflow:hidden;box-shadow:0 4px 14px #14392d09}.chapter:nth-child(even){background:#fffbf3}.chapter-art{background:#e9f7f1;display:grid;place-items:center;font-size:3.6rem;min-height:145px}.chapter:nth-child(even) .chapter-art{background:#fff4d9}.chapter-body{padding:13px}.chapter-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}.chapter-no{width:42px;height:42px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.25rem;font-weight:950}.chapter-head h2{margin:0;font-size:1.3rem}.chapter-head p{margin:2px 0;color:#60716a;font-size:.88rem}.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lesson{border:1px solid #e0e9e5;border-radius:15px;padding:11px;background:#fff;display:grid;grid-template-columns:1fr 38px;gap:8px;align-items:center;cursor:pointer}.lesson:hover{box-shadow:0 6px 16px #12392d12}.lesson small{font-weight:900;color:var(--g)}.lesson h3{margin:2px 0;font-size:.94rem}.lesson p{margin:3px 0;color:#687970;font-size:.76rem}.mini-track{height:5px;margin-top:6px}.play{width:36px;height:36px;border:0;border-radius:50%;background:var(--g);color:#fff;font-weight:900}.trainer{display:none;max-width:760px;margin:24px auto}.trainer.open{display:block}.train-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center}.steps{display:flex;gap:3px;margin:14px 0}.steps i{height:6px;flex:1;background:#e3ebe7;border-radius:9px}.steps i.on{background:var(--g)}.big{font-size:2rem;font-weight:900;margin:16px}.choices{display:grid;gap:9px;margin:16px 0}.choices button{padding:14px}.feedback{min-height:28px;font-weight:900}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.chips span,.chips button{background:#edf6f1;padding:10px 13px;border-radius:12px;font-weight:800}.meta{color:#687970;font-weight:700}.hidden{display:none}@media(max-width:850px){.summary{grid-template-columns:1fr 1fr}.chapter{grid-template-columns:1fr}.chapter-art{min-height:85px;font-size:3rem}.lessons{grid-template-columns:1fr}.navtabs{display:none}.hero{height:195px}}@media(max-width:550px){.summary{grid-template-columns:1fr}.sum{border-left:0}.hero h1{font-size:2.25rem}.hero .wide{padding-top:42px}}</style></head><body><header class="top"><div class="topin"><a class="logo" href="deutsch-lernen.html">📖 Deutsch lernen<br><small style="font-size:.7rem">Schritt für Schritt</small></a><nav class="navtabs"><a href="deutsch-a1.html">A1</a><a href="deutsch-a2.html">A2</a><a class="active" href="deutsch-b1.html">B1</a><a href="index.html">🎯 Übungen</a><a href="deutsch-test.html?level=B1">🎓 Tests</a></nav><div>⭐ <b id="xpTop">0</b> Punkte</div></div></header><section class="hero"><div class="wide"><h1>Deutsch <b>B1</b></h1><p>Fortgeschritten – selbstständig sprechen, verstehen, schreiben und argumentieren</p></div></section><main class="wide dashboard"><section class="summary"><div class="sum"><strong>📖 Dein Fortschritt · <span id="percent">0%</span></strong><div class="progress-track"><div id="progressBar" class="progress-fill"></div></div></div><div class="sum"><strong>15</strong>Lektionen</div><div class="sum"><strong>300</strong>Aufgaben</div><div class="sum"><strong>🏅 B1-Ziel</strong>nach allen Lektionen</div></section><section id="overview" class="course"></section><section id="trainer" class="trainer"><button class="btn" id="back">← Übersicht</button><div class="train-card"><b id="label"></b><div id="count" class="meta"></div><div id="bars" class="steps"></div><div id="screen"></div><div id="feedback" class="feedback"></div><button id="next" class="btn primary">Weiter →</button></div></section></main><script>
const data=[['👥','Menschen & Beziehungen','Erfahrungen, Gefühle und Beziehungen beschreiben',['Beziehung','Vertrauen','Erfahrung','gemeinsam','unterstützen'],'Gute Freunde unterstützen sich auch in schwierigen Situationen.',['Welche Aussage passt?','Freunde unterstützen sich gegenseitig.'],['Ich','finde','Vertrauen','sehr','wichtig.']],['💬','Meinung & Diskussion','Zustimmen, widersprechen und begründen',['Meinung','zustimmen','widersprechen','Argument','einerseits'],'Meiner Meinung nach ist das eine gute Lösung.',['Wie leitest du eine Meinung ein?','Meiner Meinung nach ...'],['Meiner','Meinung','nach','ist','das','sinnvoll.']],['📱','Medien & Kommunikation','Nachrichten, Internet und soziale Medien',['Nachricht','Medien','Datenschutz','veröffentlichen','informieren'],'Ich informiere mich meistens online über aktuelle Themen.',['Was bedeutet sich informieren?','Informationen suchen und bekommen.'],['Ich','informiere','mich','jeden','Tag','online.']],['💼','Bewerbung & Beruf','Bewerbung, Lebenslauf und Vorstellungsgespräch',['Bewerbung','Lebenslauf','Qualifikation','Erfahrung','Vorstellungsgespräch'],'Ich habe bereits drei Jahre Berufserfahrung im Verkauf.',['Was gehört zu einer Bewerbung?','Ein Lebenslauf.'],['Ich','habe','Berufserfahrung','im','Verkauf.']],['🤝','Arbeitsalltag','Kollegen, Aufgaben und Probleme am Arbeitsplatz',['Kollege','Aufgabe','Schicht','Verantwortung','Besprechung'],'Morgen haben wir eine wichtige Besprechung mit dem Team.',['Was ist eine Besprechung?','Ein berufliches Gespräch im Team.'],['Wir','haben','morgen','eine','Besprechung.']],['📚','Weiterbildung','Lernen, Kurse und berufliche Ziele',['Weiterbildung','Kurs','Kenntnisse','verbessern','Ziel'],'Ich mache eine Weiterbildung, um meine Chancen zu verbessern.',['Warum macht man eine Weiterbildung?','Um neue Kenntnisse zu lernen.'],['Ich','möchte','meine','Kenntnisse','verbessern.']],['🏠','Wohnen & Nachbarschaft','Miete, Hausordnung und Konflikte lösen',['Miete','Nebenkosten','Hausordnung','Vermieter','Beschwerde'],'Ich möchte mit meinem Vermieter über die Nebenkosten sprechen.',['Wer vermietet eine Wohnung?','Der Vermieter.'],['Ich','spreche','mit','meinem','Vermieter.']],['🏛️','Behörden & Formulare','Anträge verstehen und formell kommunizieren',['Antrag','Unterlagen','Bescheid','Frist','Termin'],'Für den Antrag müssen Sie alle Unterlagen einreichen.',['Was ist eine Frist?','Ein festgelegter Zeitraum.'],['Ich','muss','die','Unterlagen','einreichen.']],['💶','Geld & Verträge','Rechnungen, Verträge und wichtige Bedingungen',['Vertrag','Kündigung','Rechnung','Gebühr','Bedingung'],'Bitte prüfen Sie den Vertrag vor der Unterschrift genau.',['Was sollte man vor der Unterschrift tun?','Den Vertrag prüfen.'],['Bitte','prüfen','Sie','den','Vertrag','genau.']],['🌱','Umwelt & Zukunft','Umwelt, Energie und nachhaltiges Leben',['Umwelt','Energie','recyceln','Verkehr','nachhaltig'],'Wir können Energie sparen, indem wir weniger Strom verbrauchen.',['Was hilft der Umwelt?','Energie sparen.'],['Wir','sollten','mehr','Energie','sparen.']],['🩺','Gesundheit & Vorsorge','Gesundheit erklären und Ratschläge verstehen',['Vorsorge','Behandlung','Beschwerden','Untersuchung','Ernährung'],'Regelmäßige Bewegung ist wichtig für die Gesundheit.',['Was gehört zur Vorsorge?','Regelmäßige Untersuchungen.'],['Bewegung','ist','gut','für','die','Gesundheit.']],['🚆','Mobilität & Reisen','Reisen planen und Probleme unterwegs lösen',['Verbindung','Verspätung','Unterkunft','Reservierung','Reiseplan'],'Wegen der Verspätung habe ich meinen Anschluss verpasst.',['Was ist ein Anschluss?','Eine folgende Verbindung.'],['Der','Zug','hat','leider','Verspätung.']],['✉️','Formelle E-Mail','Anfragen, Beschwerden und Antworten schreiben',['Betreff','Anrede','Beschwerde','Rückmeldung','Mit freundlichen Grüßen'],'Ich bitte Sie um eine kurze Rückmeldung bis Freitag.',['Wie beendet man eine formelle E-Mail?','Mit freundlichen Grüßen.'],['Ich','bitte','Sie','um','eine','Rückmeldung.']],['📖','Lesen & Verstehen','Längere Texte und wichtige Informationen erfassen',['Aussage','Abschnitt','Information','Zusammenhang','Schlüsselwort'],'Beim Lesen achte ich zuerst auf Überschrift und Schlüsselwörter.',['Was hilft beim Textverstehen?','Schlüsselwörter erkennen.'],['Ich','achte','auf','wichtige','Schlüsselwörter.']],['🏆','B1 Prüfungstraining','Lesen, Schreiben, Hören und Sprechen verbinden',['Prüfung','Aufgabe','begründen','beschreiben','vorbereiten'],'In der Prüfung ist es wichtig, die Aufgabe genau zu lesen.',['Was ist vor einer Antwort wichtig?','Die Aufgabe genau lesen.'],['Ich','bereite','mich','gut','auf','die','Prüfung','vor.']]];
const groups=[['👥','Kommunikation & Menschen','Sicher sprechen, begründen und Beziehungen beschreiben.',0,3],['💼','Arbeit & Entwicklung','Beruf, Arbeitsplatz und Weiterbildung.',3,6],['🏠','Alltag & Deutschland','Wohnen, Behörden und Verträge selbstständig regeln.',6,9],['🌍','Gesund leben & unterwegs','Umwelt, Gesundheit und Mobilität.',9,12],['🎓','B1 sicher abschließen','Schreiben, Lesen und gezieltes Prüfungstraining.',12,15]];
let done=JSON.parse(localStorage.getItem('deutschB1Done')||'[]'),xp=+(localStorage.getItem('b1xp')||0),cur=0,step=0,built=[];const overview=document.getElementById('overview'),trainer=document.getElementById('trainer'),screen=document.getElementById('screen'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function draw(){overview.innerHTML='';groups.forEach((g,gi)=>{let s=document.createElement('section');s.className='chapter';s.innerHTML=`<div class="chapter-art">${g[0]}</div><div class="chapter-body"><div class="chapter-head"><span class="chapter-no">${gi+1}</span><div><h2>${g[1]}</h2><p>${g[2]}</p></div></div><div class="lessons"></div></div>`;let box=s.querySelector('.lessons');for(let i=g[3];i<g[4];i++){let l=data[i],el=document.createElement('article');el.className='lesson';el.innerHTML=`<div><small>Lektion ${i+1}</small><h3>${l[0]} ${l[1]}</h3><p>${l[2]}</p><div class="mini-track"><div class="mini-fill" style="width:${done.includes(i)?100:0}%"></div></div><p>${done.includes(i)?'20 / 20':'0 / 20'} Aufgaben</p></div><button class="play">▶</button>`;el.onclick=()=>openLesson(i);box.appendChild(el)}overview.appendChild(s)});update()}function openLesson(i){cur=i;step=0;overview.style.display='none';trainer.classList.add('open');render()}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}}function options(q,correct,opts){next.classList.add('hidden');screen.innerHTML=`<h2>❓ ${q}</h2><div class="choices">${opts.map(x=>`<button class="btn">${x}</button>`).join('')}</div>`;screen.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.textContent===correct){feedback.textContent='✅ Richtig! +5 Punkte';xp+=5;save();next.classList.remove('hidden')}else feedback.textContent='❌ Noch nicht. Versuch es erneut.'})}function render(){let l=data[cur],phase=step%10,w=l[3][step%l[3].length];label.textContent=`LEKTION ${cur+1} · ${l[1]}`;count.textContent=`Aufgabe ${step+1} von 20`;bars.innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');feedback.textContent='';next.classList.remove('hidden');if(phase===0||phase===5){screen.innerHTML=`<h2>📚 Wortschatz</h2><div class="big">${w}</div><button class="btn" id="listen">🔊 Anhören</button>`;listen.onclick=()=>speak(w)}else if(phase===1||phase===6){screen.innerHTML=`<h2>👂 Hören & Sprechen</h2><div class="big">${l[4]}</div><button class="btn" id="listen">🔊 Beispielsatz hören</button>`;listen.onclick=()=>speak(l[4])}else if(phase===2||phase===7){options(l[5][0],l[5][1],[l[5][1],l[3][0],l[4]].sort(()=>Math.random()-.5))}else if(phase===3){next.classList.add('hidden');built=[];let words=[...l[6]].sort(()=>Math.random()-.5);screen.innerHTML=`<h2>🧩 Satz bauen</h2><div class="chips">${words.map(x=>`<button class="btn piece">${x}</button>`).join('')}</div><div id="built" class="big"></div><button id="reset" class="btn">↻ Neu</button>`;screen.querySelectorAll('.piece').forEach(b=>b.onclick=()=>{built.push(b.textContent);b.disabled=true;document.getElementById('built').textContent=built.join(' ');if(built.length===l[6].length){if(built.join(' ')===l[6].join(' ')){feedback.textContent='✅ Sehr gut! +10 Punkte';xp+=10;save();next.classList.remove('hidden')}else feedback.textContent='❌ Prüfe die Wortstellung noch einmal.'}});reset.onclick=render}else if(phase===8){options('Welches Wort gehört zu diesem Thema?',l[3][2],[l[3][2],'Banane','Fenster'].sort(()=>Math.random()-.5))}else{screen.innerHTML=`<h2>🎯 B1 Sprachtraining</h2><div class="chips">${l[3].map(x=>`<span>${x}</span>`).join('')}</div><p>Formuliere selbst einen Satz und sprich ihn laut. Danach höre das Beispiel.</p><button class="btn" id="listen">🔊 Beispiel hören</button>`;listen.onclick=()=>speak(l[4])}}next.onclick=()=>{if(step<19){step++;render()}else{if(!done.includes(cur)){done.push(cur);xp+=50;localStorage.setItem('deutschB1Done',JSON.stringify(done));save()}trainer.classList.remove('open');overview.style.display='block';draw()}};back.onclick=()=>{trainer.classList.remove('open');overview.style.display='block';draw()};function save(){localStorage.setItem('b1xp',xp);update()}function update(){let p=Math.round(done.length/15*100);document.getElementById('xpTop').textContent=xp;document.getElementById('percent').textContent=p+'%';document.getElementById('progressBar').style.width=p+'%'}draw();</script></body></html>
