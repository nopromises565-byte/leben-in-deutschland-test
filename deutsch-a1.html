<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A1 interaktiv lernen</title><meta name="description" content="Deutsch A1 spielerisch und Schritt für Schritt lernen."><link rel="stylesheet" href="styles.css"><style>.learn-hero{padding:48px 0 18px}.course-progress{padding:18px;margin:20px 0}.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.lesson-card{padding:22px;cursor:pointer}.lesson-card:hover{transform:translateY(-2px)}.lesson-no{font-weight:800;color:#164f3f}.trainer{display:none;max-width:720px;margin:30px auto}.trainer.open{display:block}.trainer-card{padding:28px;text-align:center}.stepbar{display:flex;gap:6px;margin:18px 0}.stepdot{height:8px;flex:1;border-radius:20px;background:#e2e9e5}.stepdot.on{background:#164f3f}.big-icon{font-size:4rem}.big-word{font-size:clamp(2rem,7vw,3.5rem);font-weight:900;margin:12px}.translation{font-size:1.15rem;color:#66756e}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.choice{display:grid;gap:10px;margin:20px 0}.choice button{padding:16px}.feedback{min-height:30px;font-weight:800;font-size:1.1rem}.xp{font-weight:800}.hidden{display:none}.progress-track{height:10px;background:#e6ece9;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:#164f3f}</style></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">🇩🇪 Test in Deutschland</a><nav><a href="deutsch-lernen.html">← Niveaus</a><a href="deutsch-a2.html">A2 →</a></nav></div></header><main class="wrap"><section class="learn-hero"><span class="level-badge">A1</span><h1>Deutsch A1 – Schritt für Schritt</h1><p class="german-intro">Hören, verstehen, antworten und spielen. Immer nur eine kleine Aufgabe.</p><div class="panel course-progress"><strong>⭐ <span id="xp">0</span> Punkte · <span id="progressText">0 von 12 Lektionen</span></strong><div class="progress-track" style="margin-top:10px"><div id="progressBar" class="progress-fill"></div></div></div></section><section id="overview"><h2>Wähle eine Lektion</h2><div id="lessonGrid" class="lesson-grid"></div></section><section id="trainer" class="trainer"><button class="btn" id="back">← Lektionen</button><div class="panel trainer-card"><span id="lessonLabel" class="eyebrow"></span><div id="stepbar" class="stepbar"></div><div id="screen"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="btn primary">Weiter →</button></div></div></section></main><script>
const lessons=[['👋','Begrüßen & vorstellen',[['Hallo','Begrüßung'],['heißen','einen Namen haben'],['wohnen','an einem Ort leben']],['Hallo, ich heiße Sara.','Ich wohne in Berlin.'],['Wie ___ du?','heißt',['wohnst','heißt','kommst']]],['🔢','Zahlen & Alter',[['zehn','10'],['zwanzig','20'],['Jahre','Alter']],['Ich bin 25 Jahre alt.','Wie alt bist du?'],['20 heißt …','zwanzig',['zwölf','zwanzig','zwei']]],['👨‍👩‍👧','Familie',[['Mutter','Mama'],['Vater','Papa'],['Bruder','männliches Geschwister']],['Das ist meine Mutter.','Ich habe einen Bruder.'],['Das ist ___ Schwester.','meine',['mein','meine','einen']]],['🥖','Essen & Trinken',[['Wasser','Getränk'],['Brot','Lebensmittel'],['Kaffee','Getränk']],['Ich trinke Wasser.','Einen Kaffee, bitte.'],['Ich ___ Wasser.','trinke',['esse','trinke','wohne']]],['🛒','Einkaufen',[['kaufen','bezahlen und nehmen'],['kosten','einen Preis haben'],['Kasse','Ort zum Bezahlen']],['Was kostet das?','Wo ist die Kasse?'],['Wo bezahlt man?','an der Kasse',['im Bett','an der Kasse','im Bus']]],['🕐','Uhrzeit & Termine',[['heute','dieser Tag'],['morgen','nächster Tag'],['Termin','vereinbarte Zeit']],['Es ist zehn Uhr.','Ich habe morgen einen Termin.'],['Der nächste Tag heißt …','morgen',['heute','morgen','früh']]],['🏠','Wohnen',[['Wohnung','Ort zum Wohnen'],['Küche','Raum zum Kochen'],['Fenster','Öffnung mit Glas']],['Die Küche ist klein.','Das Fenster ist offen.'],['Wo kocht man?','in der Küche',['im Bad','in der Küche','im Bus']]],['🚌','Unterwegs',[['Bus','Verkehrsmittel'],['Haltestelle','Ort zum Einsteigen'],['links','Richtung']],['Wo ist die Haltestelle?','Ich fahre mit dem Bus.'],['Wo steigt man ein?','Haltestelle',['Kasse','Haltestelle','Küche']]],['💼','Arbeit & Beruf',[['Arbeit','berufliche Tätigkeit'],['Beruf','Job'],['Kollege','Person bei derselben Arbeit']],['Ich arbeite als Maurer.','Was bist du von Beruf?'],['Person bei derselben Arbeit:','Kollege',['Kollege','Fenster','Termin']]],['🩺','Gesundheit',[['Arzt','behandelt Kranke'],['krank','nicht gesund'],['Apotheke','Ort für Medikamente']],['Ich bin krank.','Ich gehe zum Arzt.'],['Wer behandelt Kranke?','Arzt',['Chef','Arzt','Kollege']]],['☀️','Freizeit & Wetter',[['Sonne','hell am Himmel'],['Regen','Wasser vom Himmel'],['kalt','nicht warm']],['Heute ist es warm.','Es regnet.'],['Gegenteil von warm:','kalt',['Sonne','kalt','spielen']]],['🏆','A1 Wiederholung',[['Hallo','Begrüßung'],['Termin','vereinbarte Zeit'],['Haltestelle','Bus und Bahn']],['Hallo, ich heiße Lina.','Ich fahre mit dem Bus zur Arbeit.'],['Wo wartet man auf den Bus?','Haltestelle',['Apotheke','Küche','Haltestelle']]]];
let current=0,step=0,xp=+(localStorage.getItem('a1xp')||0),done=JSON.parse(localStorage.getItem('deutschA1Done')||'[]');const grid=document.getElementById('lessonGrid'),screen=document.getElementById('screen'),feedback=document.getElementById('feedback'),next=document.getElementById('next');
function overview(){grid.innerHTML='';lessons.forEach((l,i)=>{let c=document.createElement('article');c.className='panel lesson-card';c.innerHTML=`<span class="lesson-no">Lektion ${i+1} ${done.includes(i)?'✓':''}</span><div class="big-icon">${l[0]}</div><h3>${l[1]}</h3><p>${done.includes(i)?'Wiederholen':'Starten und Punkte sammeln'}</p>`;c.onclick=()=>openLesson(i);grid.appendChild(c)});update()}
function openLesson(i){current=i;step=0;document.getElementById('overview').style.display='none';document.getElementById('trainer').classList.add('open');document.getElementById('lessonLabel').textContent=`Lektion ${i+1} · ${lessons[i][1]}`;render()}
function dots(){document.getElementById('stepbar').innerHTML=[0,1,2,3,4].map(i=>`<span class="stepdot ${i<=step?'on':''}"></span>`).join('')}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.8;speechSynthesis.speak(u)}}
function render(){dots();feedback.textContent='';next.classList.remove('hidden');const l=lessons[current],w=l[2][step%3];if(step===0){screen.innerHTML=`<div class="big-icon">${l[0]}</div><h2>Hören & verstehen</h2><div class="big-word">${w[0]}</div><div class="translation">${w[1]}</div><div class="actions"><button class="btn" id="listen">🔊 Anhören</button></div>`;document.getElementById('listen').onclick=()=>speak(w[0])}else if(step===1){screen.innerHTML=`<h2>🗣️ Sprich nach</h2><div class="big-word">${l[3][0]}</div><p>Höre den Satz und sprich ihn laut nach.</p><div class="actions"><button class="btn" id="listen">🔊 Satz anhören</button></div>`;document.getElementById('listen').onclick=()=>speak(l[3][0])}else if(step===2){screen.innerHTML=`<h2>📖 Verstehen</h2><div class="big-word">${l[2][1][0]}</div><div class="translation">${l[2][1][1]}</div><p class="example">${l[3][1]}</p>`}else if(step===3){next.classList.add('hidden');let q=l[4];screen.innerHTML=`<h2>❓ Deine Aufgabe</h2><h3>${q[0]}</h3><div class="choice">${q[2].map(o=>`<button class="btn answer">${o}</button>`).join('')}</div>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(b.textContent===q[1]){feedback.textContent='✅ Richtig! +10 Punkte';xp+=10;saveXp();next.classList.remove('hidden')}else feedback.textContent='❌ Versuch es noch einmal.'})}else{screen.innerHTML=`<div class="big-icon">🎉</div><h2>Lektion geschafft!</h2><p>Sehr gut! Du hast gelernt, gehört und eine Aufgabe gelöst.</p><div class="big-word">+20 ⭐</div>`;if(!done.includes(current)){done.push(current);xp+=20;localStorage.setItem('deutschA1Done',JSON.stringify(done));saveXp()}next.textContent='Fertig ✓'}}
function saveXp(){localStorage.setItem('a1xp',xp);update()}function update(){document.getElementById('xp').textContent=xp;document.getElementById('progressText').textContent=`${done.length} von 12 Lektionen`;document.getElementById('progressBar').style.width=(done.length/12*100)+'%'}next.onclick=()=>{if(step<4){step++;next.textContent='Weiter →';render()}else{document.getElementById('trainer').classList.remove('open');document.getElementById('overview').style.display='block';overview()}};document.getElementById('back').onclick=()=>{document.getElementById('trainer').classList.remove('open');document.getElementById('overview').style.display='block';overview()};overview();
</script></body></html>
