<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A1 lernen</title><link rel="stylesheet" href="styles.css"><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:#f8fbf9;color:var(--ink)}.top{background:#fff;border-bottom:1px solid #e5ece8;position:sticky;top:0;z-index:10}.topin,.wide{max-width:1500px;margin:auto;padding-left:26px;padding-right:26px}.topin{min-height:76px;display:flex;align-items:center;gap:28px}.logo{font-size:1.35rem;font-weight:950;color:var(--ink);text-decoration:none}.navtabs{display:flex;gap:6px;margin:auto}.navtabs a{padding:10px 22px;border-radius:24px;text-decoration:none;color:var(--ink);font-weight:900}.navtabs .active{background:linear-gradient(#18a75f,#08784f);color:#fff}.topstats{font-weight:900;white-space:nowrap}.hero{height:150px;background:linear-gradient(90deg,#076647,#0d8b5e);color:#fff}.hero .wide{padding-top:32px}.hero h1{font-size:3.25rem;margin:0;font-weight:950;line-height:1}.hero h1 b{color:#ffd33e}.hero p{font-size:1.08rem;margin:8px 0 0;color:#fff;opacity:.96}.dashboard{margin-top:-14px}.summary{background:#fff;border:1px solid var(--line);border-radius:21px;box-shadow:0 9px 26px #163b2d12;padding:10px 20px;display:grid;grid-template-columns:2fr 1fr 1fr 1.35fr;align-items:center;min-height:78px}.sum{padding:5px 22px;border-left:1px solid #dfe8e4}.sum:first-child{border:0}.sum strong{font-size:1.15rem;display:block}.track{height:8px;background:#e4ece8;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#129b5d}.cert{background:#fff8df;border:1px solid #efc04c;border-radius:15px;padding:9px 15px}.course{margin:16px 0 50px}.chapter{border:1px solid #dce7e2;border-radius:26px;margin:14px 0;background:linear-gradient(90deg,#f1fbf6,#fff);box-shadow:0 5px 18px #12392d0c;display:grid;grid-template-columns:160px 1fr;overflow:hidden;min-height:160px}.chapter:nth-child(even){background:linear-gradient(90deg,#fff9ed,#fff)}.chapter-art{min-height:160px;background-color:#eaf7f2;background-position:center;background-size:72% auto;background-repeat:no-repeat}.chapter-main{padding:13px 16px}.chapter-head{display:flex;align-items:center;gap:13px;margin-bottom:10px}.chapter-no{width:48px;height:48px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:950}.chapter-title{flex:1}.chapter-title h2{margin:0;font-size:1.55rem}.chapter-title p{margin:1px 0;color:#52665e}.chapter-meta{font-weight:850;display:flex;gap:18px}.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lesson{background:#fff;border:1px solid #e0e8e4;border-radius:18px;padding:10px 12px;display:grid;grid-template-columns:1fr 45px;gap:10px;align-items:center;cursor:pointer;box-shadow:0 4px 12px #173d2e0d}.lesson:hover{transform:translateY(-2px)}.lesson small{color:var(--g);font-weight:900}.lesson h3{font-size:1rem;margin:2px 0}.lesson p{font-size:.82rem;color:#60716a;margin:4px 0}.mini{height:7px;background:#e5ece8;border-radius:9px;overflow:hidden}.mini div{height:100%;background:var(--g)}.play{width:42px;height:42px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:1rem;cursor:pointer}.trainer{display:none;max-width:820px;margin:35px auto}.trainer.open{display:block}.train-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px;text-align:center}.steps{display:flex;gap:4px;margin:16px 0}.steps i{height:7px;flex:1;background:#e3ebe7;border-radius:9px}.steps i.on{background:var(--g)}.big{font-size:clamp(2rem,6vw,3rem);font-weight:900;margin:18px}.icon{font-size:4rem}.choices{display:grid;gap:10px;margin:20px 0}.choices button{padding:16px}.feedback{min-height:30px;font-weight:800}.chips{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.chips span{background:#edf6f1;padding:11px 15px;border-radius:13px;font-weight:800}.meta{color:#687970;font-weight:700}.hidden{display:none}@media(max-width:1050px){.chapter{grid-template-columns:1fr}.chapter-art{height:125px;min-height:0;background-size:auto 82%}.lessons{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.sum{border:0}.chapter-meta,.navtabs{display:none}}@media(max-width:600px){.summary{grid-template-columns:1fr}.topstats{display:none}.hero{height:145px}.hero .wide{padding-top:28px}.hero h1{font-size:2.6rem}.hero p{font-size:.95rem}.dashboard{margin-top:-8px}.wide,.topin{padding-left:14px;padding-right:14px}}</style></head><body><header class="top"><div class="topin"><a class="logo" href="deutsch-lernen.html">📖 Deutsch lernen<br><small style="font-size:.72rem">Schritt für Schritt</small></a><nav class="navtabs"><a class="active" href="deutsch-a1.html">▥ A1</a><a href="deutsch-a2.html">A2</a><a href="deutsch-b1.html">B1</a><a href="index.html">🎯 Übungen</a><a href="index.html#pruefung">🎓 Tests</a></nav><div class="topstats">🔥 0 Tage　⭐ <span id="xpTop">0</span> Punkte</div></div></header><section class="hero"><div class="wide"><h1>Deutsch <b>A1</b></h1><p>Grundstufe – für Alltag, Arbeit und Leben in Deutschland</p></div></section><main class="wide dashboard"><section class="summary"><div class="sum"><strong>📖 Dein Fortschritt · <span id="percent">0%</span></strong><div class="track"><div id="progressBar" class="fill"></div></div></div><div class="sum"><strong>📚 12</strong>Lektionen</div><div class="sum"><strong>☑️ 240</strong>Aufgaben</div><div class="sum cert"><strong>🏅 A1-Zertifikat</strong>nach Abschluss</div></section><section id="overview" class="course"></section><section id="trainer" class="trainer"><button class="btn" id="back">← Übersicht</button><div class="train-card"><b id="label"></b><div id="count" class="meta"></div><div id="bars" class="steps"></div><div id="screen"></div><div id="feedback" class="feedback"></div><button id="next" class="btn primary">Weiter →</button></div></section></main><script>const data=[['👋','Begrüßen & vorstellen','Hallo sagen und dich vorstellen',['Hallo','heißen','wohnen','kommen','Name'],['Hallo, ich heiße Sara.','Ich wohne in Berlin.'],['Wie heißt du?','Ich heiße Sara.']],['🔢','Zahlen & Alter','Zahlen, Alter und Telefonnummer',['zehn','zwanzig','Jahre','Nummer','alt'],['Ich bin 25 Jahre alt.','Meine Nummer ist 123.'],['Wie alt bist du?','Ich bin 25 Jahre alt.']],['👨‍👩‍👧','Familie','Über deine Familie sprechen',['Mutter','Vater','Bruder','Schwester','Kind'],['Das ist meine Mutter.','Ich habe einen Bruder.'],['Wer ist das?','Das ist meine Mutter.']],['🥖','Essen & Trinken','Bestellen und Lebensmittel nennen',['Wasser','Brot','Kaffee','essen','trinken'],['Ich trinke Wasser.','Einen Kaffee, bitte.'],['Was möchtest du?','Einen Kaffee, bitte.']],['🛒','Einkaufen','Preise fragen und bezahlen',['kaufen','kosten','Euro','Kasse','billig'],['Was kostet das?','Wo ist die Kasse?'],['Wo bezahlst du?','An der Kasse.']],['🕐','Uhrzeit & Termine','Zeit und Termine verstehen',['heute','morgen','Uhr','Termin','spät'],['Es ist zehn Uhr.','Morgen habe ich einen Termin.'],['Wann ist der Termin?','Morgen.']],['🗺️','Orientierung & Wege','Einfache Wege verstehen',['geradeaus','Straße','Ampel','Ecke','Bahnhof'],['Gehen Sie geradeaus.','Der Bahnhof ist links.'],['Wo ist der Bahnhof?','Links.']],['🚌','Bus, Bahn & Verkehr','Mit öffentlichen Verkehrsmitteln fahren',['Bus','Bahn','Haltestelle','links','rechts'],['Wo ist die Haltestelle?','Ich fahre mit dem Bus.'],['Wo steigt man ein?','An der Haltestelle.']],['🏙️','In der Stadt','Wichtige Orte finden',['Stadt','Bahnhof','Apotheke','Markt','Straße'],['Die Apotheke ist dort.','Ich gehe zum Bahnhof.'],['Wo kaufst du Medikamente?','In der Apotheke.']],['💼','Arbeit & Beruf','Über Beruf und Arbeit sprechen',['Arbeit','Beruf','Chef','Kollege','Pause'],['Ich arbeite als Maurer.','Um zwölf Uhr ist Pause.'],['Was bist du von Beruf?','Ich bin Maurer.']],['🩺','Beim Arzt','Einfache Beschwerden ausdrücken',['Arzt','krank','Schmerz','Apotheke','Bauch'],['Ich bin krank.','Ich gehe zum Arzt.'],['Wer hilft bei Krankheit?','Der Arzt.']],['✉️','Nachrichten & E-Mails','Einfache Nachrichten schreiben',['Hallo','Termin','Arbeit','Bus','Danke'],['Ich komme morgen um zehn Uhr.','Vielen Dank und bis morgen.'],['Wann kommst du?','Morgen um zehn Uhr.']]];const groups=[['Erste Schritte','Ankommen, begrüßen und dich vorstellen.','assets/a1-people.svg',0,3],['Mein Alltag','Essen, einkaufen und den Tag planen.','assets/a1-groceries.svg',3,6],['Unterwegs','In der Stadt, mit Bus und Bahn, orientieren.','assets/a1-bus.svg',6,9],['Arbeit & Gesundheit','Arbeiten, beim Arzt und wichtige Situationen.','assets/a1-work-health.svg',9,12]];let done=JSON.parse(localStorage.getItem('deutschA1Done')||'[]'),xp=+(localStorage.getItem('a1xp')||0),cur=0,step=0;const overview=document.getElementById('overview'),trainer=document.getElementById('trainer'),screen=document.getElementById('screen'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function draw(){overview.innerHTML='';groups.forEach((g,gi)=>{let s=document.createElement('section');s.className='chapter';s.innerHTML=`<div class="chapter-art" style="background-image:url('${g[2]}')"></div><div class="chapter-main"><div class="chapter-head"><span class="chapter-no">${gi+1}</span><div class="chapter-title"><h2>${g[0]}</h2><p>${g[1]}</p></div><div class="chapter-meta">📖 3 Lektionen　│　◷ ca. 30–45 Min.</div></div><div class="lessons"></div></div>`;let box=s.querySelector('.lessons');for(let i=g[3];i<g[4];i++){let l=data[i],el=document.createElement('article');el.className='lesson';let pct=done.includes(i)?100:0;el.innerHTML=`<div><small>Lektion ${i+1}</small><h3>${l[1]}</h3><p>${done.includes(i)?'20 / 20':'0 / 20'} Aufgaben</p><div class="mini"><div style="width:${pct}%"></div></div></div><button class="play">▶</button>`;el.onclick=()=>openLesson(i);box.appendChild(el)}overview.appendChild(s)});update()}function openLesson(i){cur=i;step=0;overview.style.display='none';trainer.classList.add('open');render()}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.78;speechSynthesis.speak(u)}}function options(q,correct,opts){next.classList.add('hidden');screen.innerHTML=`<h2>❓ ${q}</h2><div class="choices">${opts.map(x=>`<button class="btn">${x}</button>`).join('')}</div>`;screen.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.textContent===correct){feedback.textContent='✅ Richtig! +5 Punkte';xp+=5;save();next.classList.remove('hidden')}else feedback.textContent='❌ Versuch es noch einmal.'})}function render(){let l=data[cur],phase=step%10,w=l[3][step%l[3].length];label.textContent=`LEKTION ${cur+1} · ${l[1]}`;count.textContent=`Aufgabe ${step+1} von 20`;bars.innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');feedback.textContent='';next.classList.remove('hidden');next.textContent='Weiter →';if(phase===0||phase===5){screen.innerHTML=`<div class="icon">${l[0]}</div><h2>Neues Wort</h2><div class="big">${w}</div><button class="btn" id="listen">🔊 Anhören</button>`;listen.onclick=()=>speak(w)}else if(phase===1||phase===6){let s=l[4][step%2];screen.innerHTML=`<h2>👂 Hören & nachsprechen</h2><div class="big">${s}</div><button class="btn" id="listen">🔊 Satz anhören</button>`;listen.onclick=()=>speak(s)}else if(phase===2||phase===7){options('Welches Wort gehört zum Thema?',l[3][1],[l[3][1],'Flugzeug','Computer'].sort(()=>Math.random()-.5))}else if(phase===3||phase===8){options(l[5][0],l[5][1],[l[5][1],l[4][0],l[3][0]].sort(()=>Math.random()-.5))}else{screen.innerHTML=`<h2>🎯 Schnelltraining</h2><div class="chips">${l[3].map(x=>`<span>${x}</span>`).join('')}</div><p>Sprich alle Wörter laut und höre danach den Beispielsatz.</p><button class="btn" id="listen">🔊 Beispiel hören</button>`;listen.onclick=()=>speak(l[4][0])}}next.onclick=()=>{if(step<19){step++;render()}else{if(!done.includes(cur)){done.push(cur);xp+=30;localStorage.setItem('deutschA1Done',JSON.stringify(done));save()}trainer.classList.remove('open');overview.style.display='block';draw()}};back.onclick=()=>{trainer.classList.remove('open');overview.style.display='block';draw()};function save(){localStorage.setItem('a1xp',xp);update()}function update(){let p=Math.round(done.length/12*100);xpTop.textContent=xp;percent.textContent=p+'%';progressBar.style.width=p+'%'}draw();</script></body></html>
