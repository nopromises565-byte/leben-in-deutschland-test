<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A1 lernen</title><link rel="stylesheet" href="styles.css"><style>:root{--g:#086b49;--g2:#0c8a5d;--gold:#d69a16;--ink:#10243b;--line:#dce7e2}body{background:#f7faf8;color:var(--ink)}.appbar{background:#fff;border-bottom:1px solid #e5ece8}.appbar .nav{min-height:72px}.brand2{font-size:1.35rem;font-weight:900;color:var(--ink);text-decoration:none}.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs a{padding:10px 18px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:800}.tabs a.active{background:var(--g);color:#fff}.heroA{background:linear-gradient(115deg,#075b42,#0d7955 66%,#d9ad43);color:#fff;padding:34px 0 74px}.heroA h1{font-size:clamp(2.3rem,5vw,4rem);margin:0}.heroA h1 b{color:#ffd447}.heroA p{font-size:1.15rem;margin:8px 0 0}.dashboard{margin-top:-48px}.summary{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px #14392d12;padding:20px;display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px;align-items:center}.sum{padding:10px 18px;border-left:1px solid #e5ece8}.sum:first-child{border-left:0}.sum strong{font-size:1.35rem;display:block}.progress-track{height:10px;background:#e7eeeb;border-radius:99px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:var(--g2)}.course{margin:24px 0}.chapter{border:1px solid var(--line);background:#fff;border-radius:25px;padding:18px;margin:18px 0;box-shadow:0 5px 18px #14392d0b}.chapter:nth-child(even){background:#fffbf2}.chapter-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}.chapter-no{width:52px;height:52px;border-radius:15px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:900}.chapter-head h2{margin:0;font-size:1.55rem}.chapter-head p{margin:2px 0;color:#60716a}.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.lesson{border:1px solid #e2eae6;border-radius:19px;padding:16px;display:grid;grid-template-columns:62px 1fr 46px;gap:12px;align-items:center;background:#fff;cursor:pointer;transition:.18s}.lesson:hover{transform:translateY(-2px);box-shadow:0 8px 22px #12392d14}.lesson-icon{width:58px;height:58px;border-radius:16px;background:#eaf6f0;display:grid;place-items:center;font-size:2rem}.lesson h3{margin:2px 0;font-size:1.05rem}.lesson small{font-weight:800;color:var(--g)}.lesson p{margin:5px 0;color:#65756e;font-size:.88rem}.mini-track{height:6px;background:#e8eeeb;border-radius:9px;overflow:hidden}.mini-fill{height:100%;background:var(--g)}.play{width:42px;height:42px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:1.1rem;cursor:pointer}.trainer{display:none;max-width:780px;margin:30px auto}.trainer.open{display:block}.train-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px;text-align:center}.steps{display:flex;gap:4px;margin:16px 0}.steps i{height:7px;flex:1;background:#e3ebe7;border-radius:9px}.steps i.on{background:var(--g)}.big{font-size:clamp(2rem,6vw,3rem);font-weight:900;margin:18px}.icon{font-size:4rem}.choices{display:grid;gap:10px;margin:20px 0}.choices button{padding:16px}.feedback{min-height:30px;font-weight:800}.chips{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.chips span{background:#edf6f1;padding:11px 15px;border-radius:13px;font-weight:800}.meta{color:#687970;font-weight:700}.hidden{display:none}@media(max-width:900px){.summary{grid-template-columns:1fr 1fr}.sum{border-left:0}.lessons{grid-template-columns:1fr}}@media(max-width:600px){.summary{grid-template-columns:1fr}.tabs{display:none}.heroA{padding-bottom:65px}.chapter{padding:12px}.lesson{grid-template-columns:54px 1fr 42px}}</style></head><body><header class="appbar"><div class="wrap nav"><a class="brand2" href="deutsch-lernen.html">📖 Deutsch lernen</a><nav class="tabs"><a class="active" href="deutsch-a1.html">A1</a><a href="deutsch-a2.html">A2</a><a href="deutsch-b1.html">B1</a><a href="index.html">🇩🇪 Test</a></nav><div>⭐ <b id="xpTop">0</b></div></div></header><section class="heroA"><div class="wrap"><h1>Deutsch <b>A1</b></h1><p>Grundstufe – für Alltag, Arbeit und Leben in Deutschland</p></div></section><main class="wrap dashboard"><section class="summary"><div class="sum"><strong>📖 Dein Fortschritt · <span id="percent">0%</span></strong><div class="progress-track"><div id="progressBar" class="progress-fill" style="width:0%"></div></div></div><div class="sum"><strong>12</strong>Lektionen</div><div class="sum"><strong>240</strong>Aufgaben</div><div class="sum"><strong>🏅 A1</strong>Abschluss nach allen Lektionen</div></section><section id="overview" class="course"></section><section id="trainer" class="trainer"><button class="btn" id="back">← Übersicht</button><div class="train-card"><b id="label"></b><div id="count" class="meta"></div><div id="bars" class="steps"></div><div id="screen"></div><div id="feedback" class="feedback"></div><button id="next" class="btn primary">Weiter →</button></div></section></main><script>
const data=[['👋','Begrüßen & vorstellen','Hallo sagen und dich vorstellen',['Hallo','heißen','wohnen','kommen','Name'],['Hallo, ich heiße Sara.','Ich wohne in Berlin.'],['Wie heißt du?','Ich heiße Sara.']],['🔢','Zahlen & Alter','Zahlen, Alter und Telefonnummer',['zehn','zwanzig','Jahre','Nummer','alt'],['Ich bin 25 Jahre alt.','Meine Nummer ist 123.'],['Wie alt bist du?','Ich bin 25 Jahre alt.']],['👨‍👩‍👧','Familie','Über deine Familie sprechen',['Mutter','Vater','Bruder','Schwester','Kind'],['Das ist meine Mutter.','Ich habe einen Bruder.'],['Wer ist das?','Das ist meine Mutter.']],['🥖','Essen & Trinken','Bestellen und Lebensmittel nennen',['Wasser','Brot','Kaffee','essen','trinken'],['Ich trinke Wasser.','Einen Kaffee, bitte.'],['Was möchtest du?','Einen Kaffee, bitte.']],['🛒','Einkaufen','Preise fragen und bezahlen',['kaufen','kosten','Euro','Kasse','billig'],['Was kostet das?','Wo ist die Kasse?'],['Wo bezahlst du?','An der Kasse.']],['🕐','Uhrzeit & Termine','Zeit und Termine verstehen',['heute','morgen','Uhr','Termin','spät'],['Es ist zehn Uhr.','Morgen habe ich einen Termin.'],['Wann ist der Termin?','Morgen.']],['🏠','Wohnen','Wohnung und Zimmer beschreiben',['Wohnung','Zimmer','Küche','Bad','Fenster'],['Die Küche ist klein.','Das Fenster ist offen.'],['Wo kochst du?','In der Küche.']],['🚌','Unterwegs','Bus, Bahn und Wege',['Bus','Bahn','Haltestelle','links','rechts'],['Wo ist die Haltestelle?','Ich fahre mit dem Bus.'],['Wo steigt man ein?','An der Haltestelle.']],['🗺️','Orientierung','Einfache Wege verstehen',['geradeaus','Straße','Ampel','Ecke','Bahnhof'],['Gehen Sie geradeaus.','Der Bahnhof ist links.'],['Wo ist der Bahnhof?','Links.']],['💼','Arbeit & Beruf','Über Beruf und Arbeit sprechen',['Arbeit','Beruf','Chef','Kollege','Pause'],['Ich arbeite als Maurer.','Um zwölf Uhr ist Pause.'],['Was bist du von Beruf?','Ich bin Maurer.']],['🩺','Beim Arzt','Einfache Beschwerden ausdrücken',['Arzt','krank','Schmerz','Apotheke','Bauch'],['Ich bin krank.','Ich gehe zum Arzt.'],['Wer hilft bei Krankheit?','Der Arzt.']],['✉️','Nachrichten & Abschluss','Einfache Nachrichten und Wiederholung',['Hallo','Termin','Arbeit','Bus','Danke'],['Ich komme morgen um zehn Uhr.','Vielen Dank und bis morgen.'],['Wann kommst du?','Morgen um zehn Uhr.']]];
const groups=[['Erste Schritte','Ankommen, begrüßen und dich vorstellen.',0,3],['Mein Alltag','Essen, einkaufen und den Tag planen.',3,6],['Unterwegs','Wohnen, Wege und Bus & Bahn.',6,9],['Arbeit & Gesundheit','Arbeiten, Arzt und wichtige Nachrichten.',9,12]];let done=JSON.parse(localStorage.getItem('deutschA1Done')||'[]'),xp=+(localStorage.getItem('a1xp')||0),cur=0,step=0;const overview=document.getElementById('overview'),trainer=document.getElementById('trainer'),screen=document.getElementById('screen'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function draw(){overview.innerHTML='';groups.forEach((g,gi)=>{let s=document.createElement('section');s.className='chapter';s.innerHTML=`<div class="chapter-head"><span class="chapter-no">${gi+1}</span><div><h2>${g[0]}</h2><p>${g[1]}</p></div></div><div class="lessons"></div>`;let box=s.querySelector('.lessons');for(let i=g[2];i<g[3];i++){let l=data[i],el=document.createElement('article');el.className='lesson';let pct=done.includes(i)?100:0;el.innerHTML=`<div class="lesson-icon">${done.includes(i)?'✓':l[0]}</div><div><small>Lektion ${i+1}</small><h3>${l[1]}</h3><p>${l[2]}</p><div class="mini-track"><div class="mini-fill" style="width:${pct}%"></div></div><p>${done.includes(i)?'20 / 20':'0 / 20'} Aufgaben</p></div><button class="play" aria-label="Starten">▶</button>`;el.onclick=()=>open(i);box.appendChild(el)}overview.appendChild(s)});update()}function open(i){cur=i;step=0;overview.style.display='none';trainer.classList.add('open');render()}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.78;speechSynthesis.speak(u)}}function options(q,correct,opts){next.classList.add('hidden');screen.innerHTML=`<h2>❓ ${q}</h2><div class="choices">${opts.map(x=>`<button class="btn">${x}</button>`).join('')}</div>`;screen.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.textContent===correct){feedback.textContent='✅ Richtig! +5 Punkte';xp+=5;save();next.classList.remove('hidden')}else feedback.textContent='❌ Versuch es noch einmal.'})}function render(){let l=data[cur],phase=step%10,w=l[3][step%l[3].length];label.textContent=`LEKTION ${cur+1} · ${l[1]}`;count.textContent=`Aufgabe ${step+1} von 20`;bars.innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');feedback.textContent='';next.classList.remove('hidden');next.textContent='Weiter →';if(phase===0||phase===5){screen.innerHTML=`<div class="icon">${l[0]}</div><h2>Neues Wort</h2><div class="big">${w}</div><button class="btn" id="listen">🔊 Anhören</button>`;listen.onclick=()=>speak(w)}else if(phase===1||phase===6){let s=l[4][step%2];screen.innerHTML=`<h2>👂 Hören & nachsprechen</h2><div class="big">${s}</div><button class="btn" id="listen">🔊 Satz anhören</button>`;listen.onclick=()=>speak(s)}else if(phase===2||phase===7){options('Welches Wort gehört zum Thema?',l[3][1],[l[3][1],'Flugzeug','Computer'].sort(()=>Math.random()-.5))}else if(phase===3||phase===8){options(l[5][0],l[5][1],[l[5][1],l[4][0],l[3][0]].sort(()=>Math.random()-.5))}else{screen.innerHTML=`<h2>🎯 Schnelltraining</h2><div class="chips">${l[3].map(x=>`<span>${x}</span>`).join('')}</div><p>Sprich alle Wörter laut und höre danach den Beispielsatz.</p><button class="btn" id="listen">🔊 Beispiel hören</button>`;listen.onclick=()=>speak(l[4][0])}}next.onclick=()=>{if(step<19){step++;render()}else{if(!done.includes(cur)){done.push(cur);xp+=30;localStorage.setItem('deutschA1Done',JSON.stringify(done));save()}trainer.classList.remove('open');overview.style.display='block';draw()}};back.onclick=()=>{trainer.classList.remove('open');overview.style.display='block';draw()};function save(){localStorage.setItem('a1xp',xp);update()}function update(){let p=Math.round(done.length/12*100);document.getElementById('xpTop').textContent=xp;document.getElementById('percent').textContent=p+'%';document.getElementById('progressBar').style.width=p+'%'}draw();</script></body></html>
