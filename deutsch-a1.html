<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A1 Lernpfad</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8f7}.hero{padding:42px 0 10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid #e2e9e5;border-radius:18px;padding:12px 18px;font-weight:800}.world{max-width:780px;margin:34px auto}.world-head{background:linear-gradient(135deg,#155b46,#208264);color:#fff;border-radius:24px;padding:24px;margin-bottom:22px}.world-head h2{margin:4px 0}.path{position:relative;padding:8px 0 32px}.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;background:#dce8e2;transform:translateX(-50%);border-radius:9px}.node{position:relative;display:flex;align-items:center;gap:20px;margin:28px 0;z-index:1}.node:nth-child(even){flex-direction:row-reverse}.orb{width:104px;height:104px;min-width:104px;border-radius:50%;background:#176249;color:#fff;border:8px solid #e2f0e9;display:grid;place-items:center;font-size:2.6rem;box-shadow:0 7px 20px #173c2d22;cursor:pointer}.node-info{background:#fff;border:1px solid #dfe8e3;border-radius:20px;padding:16px 18px;width:calc(50% - 72px);box-shadow:0 5px 18px #173c2d0d}.node-info h3{margin:2px 0 5px}.meta{font-size:.85rem;color:#60716a}.done .orb{background:#e0a91b}.trainer{display:none;max-width:760px;margin:28px auto}.trainer.open{display:block}.card{background:#fff;border:1px solid #dfe8e3;border-radius:26px;padding:30px;text-align:center}.steps{display:flex;gap:4px;margin:15px 0}.steps i{height:7px;flex:1;background:#e2e9e5;border-radius:8px}.steps i.on{background:#176249}.big{font-size:3rem;font-weight:900;margin:18px}.icon{font-size:4rem}.choices{display:grid;gap:10px;margin:20px 0}.choices button{padding:16px}.feedback{min-height:28px;font-weight:800}.hidden{display:none}.wordchips{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.wordchips span{background:#edf5f1;padding:11px 15px;border-radius:14px;font-weight:800}@media(max-width:650px){.node,.node:nth-child(even){flex-direction:row}.path:before{left:52px}.orb{width:82px;height:82px;min-width:82px}.node-info{width:auto;flex:1}.world-head{border-radius:18px}}</style></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">🇩🇪 Test in Deutschland</a><nav><a href="deutsch-lernen.html">← Niveaus</a><a href="deutsch-a2.html">A2 →</a></nav></div></header><main class="wrap"><section class="hero"><span class="level-badge">A1</span><h1>Dein A1-Lernpfad</h1><p>Keine langen Listen: Folge dem Weg und trainiere jede Lektion mit <strong>20 kleinen Aufgaben</strong>.</p><div class="stats"><div class="stat">⭐ <span id="xp">0</span> Punkte</div><div class="stat">🏆 <span id="progress">0 / 12</span> geschafft</div><div class="stat">🎯 240 Aufgaben</div></div></section><section id="overview"></section><section id="trainer" class="trainer"><button class="btn" id="back">← Lernpfad</button><div class="card"><b id="label"></b><div id="count" class="meta"></div><div id="bars" class="steps"></div><div id="screen"></div><div id="feedback" class="feedback"></div><button id="next" class="btn primary">Weiter →</button></div></section></main><script>
const data=[['👋','Begrüßen & vorstellen','Hallo sagen und dich vorstellen',['Hallo','heißen','wohnen','kommen','Name'],['Hallo, ich heiße Sara.','Ich wohne in Berlin.'],['Wie heißt du?','Ich heiße Sara.']],['🔢','Zahlen & Alter','Zahlen, Alter und Telefonnummer',['zehn','zwanzig','Jahre','Nummer','alt'],['Ich bin 25 Jahre alt.','Meine Nummer ist 123.'],['Wie alt bist du?','Ich bin 25 Jahre alt.']],['👨‍👩‍👧','Familie','Über deine Familie sprechen',['Mutter','Vater','Bruder','Schwester','Kind'],['Das ist meine Mutter.','Ich habe einen Bruder.'],['Wer ist das?','Das ist meine Mutter.']],['🥖','Essen & Trinken','Bestellen und Lebensmittel nennen',['Wasser','Brot','Kaffee','essen','trinken'],['Ich trinke Wasser.','Einen Kaffee, bitte.'],['Was möchtest du?','Einen Kaffee, bitte.']],['🛒','Einkaufen','Preise fragen und bezahlen',['kaufen','kosten','Euro','Kasse','billig'],['Was kostet das?','Wo ist die Kasse?'],['Wo bezahlst du?','An der Kasse.']],['🕐','Uhrzeit & Termine','Zeit und Termine verstehen',['heute','morgen','Uhr','Termin','spät'],['Es ist zehn Uhr.','Morgen habe ich einen Termin.'],['Wann ist der Termin?','Morgen.']],['🏠','Wohnen','Wohnung und Zimmer beschreiben',['Wohnung','Zimmer','Küche','Bad','Fenster'],['Die Küche ist klein.','Das Fenster ist offen.'],['Wo kochst du?','In der Küche.']],['🚌','Unterwegs','Bus, Bahn und Wege',['Bus','Bahn','Haltestelle','links','rechts'],['Wo ist die Haltestelle?','Ich fahre mit dem Bus.'],['Wo steigt man ein?','An der Haltestelle.']],['💼','Arbeit & Beruf','Über Beruf und Arbeit sprechen',['Arbeit','Beruf','Chef','Kollege','Pause'],['Ich arbeite als Maurer.','Um zwölf Uhr ist Pause.'],['Was bist du von Beruf?','Ich bin Maurer.']],['🩺','Gesundheit','Beim Arzt sprechen',['Arzt','krank','Schmerz','Apotheke','Bauch'],['Ich bin krank.','Ich gehe zum Arzt.'],['Wer hilft bei Krankheit?','Der Arzt.']],['☀️','Freizeit & Wetter','Wetter und Freizeit',['Sonne','Regen','warm','kalt','spielen'],['Heute ist es warm.','Es regnet.'],['Wie ist das Wetter?','Es ist warm.']],['🏆','A1 Abschluss','Alles noch einmal üben',['Hallo','Familie','Termin','Arbeit','Bus'],['Hallo, ich heiße Lina.','Ich fahre zur Arbeit.'],['Wo wartet man auf den Bus?','An der Haltestelle.']]];
const groups=[['🌱','Start & Menschen','Deine ersten Gespräche',0,3],['🏡','Alltag meistern','Essen, Einkaufen und Termine',3,6],['🚶','Leben in Deutschland','Wohnen, unterwegs sein und arbeiten',6,9],['🏆','Sicher im Alltag','Gesundheit, Freizeit und Abschluss',9,12]];let done=JSON.parse(localStorage.getItem('deutschA1Done')||'[]'),xp=+(localStorage.getItem('a1xp')||0),cur=0,step=0;const overview=document.getElementById('overview'),trainer=document.getElementById('trainer'),screen=document.getElementById('screen'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function draw(){overview.innerHTML='';groups.forEach(g=>{let s=document.createElement('section');s.className='world';s.innerHTML=`<div class="world-head"><small>THEMENWELT</small><h2>${g[0]} ${g[1]}</h2><div>${g[2]}</div></div><div class="path"></div>`;let p=s.querySelector('.path');for(let i=g[3];i<g[4];i++){let l=data[i],n=document.createElement('div');n.className='node '+(done.includes(i)?'done':'');n.innerHTML=`<button class="orb">${done.includes(i)?'✓':l[0]}</button><div class="node-info"><b>LEKTION ${i+1}</b><h3>${l[1]}</h3><div>${l[2]}</div><p class="meta">20 Aufgaben · 🔊 Hören · 🗣️ Sprechen · ❓ Quiz</p></div>`;n.onclick=()=>open(i);p.appendChild(n)}overview.appendChild(s)});update()}function open(i){cur=i;step=0;overview.style.display='none';trainer.classList.add('open');render()}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.78;speechSynthesis.speak(u)}function options(q,correct,opts){next.classList.add('hidden');screen.innerHTML=`<h2>❓ ${q}</h2><div class="choices">${opts.map(x=>`<button class="btn">${x}</button>`).join('')}</div>`;screen.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.textContent===correct){feedback.textContent='✅ Richtig! +5 Punkte';xp+=5;save();next.classList.remove('hidden')}else feedback.textContent='❌ Versuch es noch einmal.'})}function render(){let l=data[cur],phase=step%10,w=l[3][step%l[3].length];document.getElementById('label').textContent=`LEKTION ${cur+1} · ${l[1]}`;document.getElementById('count').textContent=`Aufgabe ${step+1} von 20`;document.getElementById('bars').innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');feedback.textContent='';next.classList.remove('hidden');next.textContent='Weiter →';if(phase===0||phase===5){screen.innerHTML=`<div class="icon">${l[0]}</div><h2>Neues Wort</h2><div class="big">${w}</div><button class="btn" id="listen">🔊 Anhören</button>`;listen.onclick=()=>speak(w)}else if(phase===1||phase===6){let s=l[4][step%2];screen.innerHTML=`<h2>👂 Hören & nachsprechen</h2><div class="big">${s}</div><button class="btn" id="listen">🔊 Satz anhören</button>`;listen.onclick=()=>speak(s)}else if(phase===2||phase===7){options('Welches Wort gehört zum Thema?',l[3][1],[l[3][1],'Flugzeug','Computer'].sort(()=>Math.random()-.5))}else if(phase===3||phase===8){options(l[5][0],l[5][1],[l[5][1],l[4][0],l[3][0]].sort(()=>Math.random()-.5))}else{screen.innerHTML=`<h2>🎯 Schnelltraining</h2><div class="wordchips">${l[3].map(x=>`<span>${x}</span>`).join('')}</div><p>Sprich alle Wörter laut und höre danach den Beispielsatz.</p><button class="btn" id="listen">🔊 Beispiel hören</button>`;listen.onclick=()=>speak(l[4][0])}}next.onclick=()=>{if(step<19){step++;render()}else{if(!done.includes(cur)){done.push(cur);xp+=30;localStorage.setItem('deutschA1Done',JSON.stringify(done));save()}trainer.classList.remove('open');overview.style.display='block';draw()}};back.onclick=()=>{trainer.classList.remove('open');overview.style.display='block';draw()};function save(){localStorage.setItem('a1xp',xp);update()}function update(){document.getElementById('xp').textContent=xp;document.getElementById('progress').textContent=`${done.length} / 12`}draw();</script></body></html>
