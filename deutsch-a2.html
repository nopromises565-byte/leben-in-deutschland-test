<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A2 lernen – 12 Lektionen</title><meta name="description" content="Deutsch A2 einfach lernen mit 12 Alltagslektionen, Übungen, Mini-Quiz und Lernspielen."><link rel="stylesheet" href="styles.css"><style>.course-progress{margin:24px 0;padding:20px}.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.lesson{padding:22px}.lesson h3{margin:10px 0}.lesson-no{font-weight:800;color:#164f3f}.lesson-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.lesson-detail{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #e3e8e6}.lesson-detail.open{display:block}.example{background:#f4f8f6;border-radius:12px;padding:12px;margin:10px 0}.quiz-options{display:grid;gap:8px;margin:10px 0}.quiz-options button{text-align:left}.feedback{font-weight:700;min-height:24px}.done{opacity:.72}.done .lesson-no:after{content:' ✓';color:#16835b}.progress-track{height:10px;background:#e6ece9;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:#164f3f}.word-game{display:flex;gap:8px;flex-wrap:wrap}.word-game button{cursor:pointer}</style></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">🇩🇪 Test in Deutschland</a><nav><a href="deutsch-lernen.html">← Niveaus</a><a href="deutsch-a1.html">A1</a><a href="deutsch-a2.html">A2</a><a href="deutsch-b1.html">B1</a></nav></div></header><main class="wrap"><section class="section choice-home"><span class="level-badge">A2</span><h1>Deutsch A2 lernen</h1><p class="german-intro">Deutsch für Alltag, Gespräche und wichtige Situationen. Kleine Lektionen, einfache Beispiele und direktes Üben.</p><div class="panel course-progress"><strong>Dein A2-Fortschritt: <span id="progressText">0 von 12 Lektionen</span></strong><div class="progress-track" style="margin-top:10px"><div id="progressBar" class="progress-fill" style="width:0%"></div></div></div><div id="lessons" class="lesson-grid"></div></section></main><script>
const lessons=[
{t:'Über Vergangenes sprechen',icon:'🕐',words:['gestern','letzte Woche','besucht','gemacht','gefahren'],learn:'Im Alltag erzählst du oft, was passiert ist. Dafür benutzt du häufig das Perfekt.',ex:'Ich habe gestern meine Freundin besucht. Wir sind zusammen in die Stadt gefahren.',q:'Welcher Satz ist richtig?',opts:['Ich habe gestern gearbeitet.','Ich gestern gearbeitet habe.','Ich hat gestern arbeiten.'],a:0,game:['Ich','habe','gestern','gekocht.']},
{t:'Termine & Verabredungen',icon:'📅',words:['Termin','verschieben','passen','verabreden','Uhrzeit'],learn:'Du lernst Termine zu vereinbaren, abzusagen oder zu verschieben.',ex:'Passt es dir am Freitag um 15 Uhr? – Leider nicht. Können wir den Termin verschieben?',q:'Du kannst am Freitag nicht. Was passt?',opts:['Können wir den Termin verschieben?','Ich verschiebe gestern.','Der Termin kann essen.'],a:0,game:['Können','wir','uns','morgen','treffen?']},
{t:'Wohnen & Nachbarschaft',icon:'🏠',words:['Nachbar','Miete','Hausordnung','laut','ruhig'],learn:'Du beschreibst deine Wohnung und sprichst höflich mit Nachbarn.',ex:'Meine Wohnung ist ruhig, aber die Nachbarn über mir sind manchmal sehr laut.',q:'Was ist ein Nachbar?',opts:['Eine Person, die neben dir wohnt.','Ein Verkehrsmittel.','Ein Lebensmittel.'],a:0,game:['Meine','Wohnung','ist','sehr','ruhig.']},
{t:'Arbeit & Beruf',icon:'💼',words:['Bewerbung','Kollege','Arbeitszeit','Aufgabe','Erfahrung'],learn:'Du kannst über deinen Beruf, deine Aufgaben und Berufserfahrung sprechen.',ex:'Ich arbeite seit zwei Jahren als Verkäufer. Meine Arbeitszeit beginnt um acht Uhr.',q:'Welcher Satz beschreibt Erfahrung?',opts:['Ich arbeite seit zwei Jahren hier.','Ich arbeite morgen gestern.','Ich zwei Jahre Arbeit.'],a:0,game:['Ich','habe','Berufserfahrung','im','Verkauf.']},
{t:'Beim Arzt',icon:'🩺',words:['Schmerzen','Rezept','Untersuchung','Tablette','krank'],learn:'Du beschreibst Beschwerden und verstehst einfache Anweisungen beim Arzt.',ex:'Ich habe seit drei Tagen Halsschmerzen. – Nehmen Sie diese Tabletten zweimal täglich.',q:'Was sagst du bei Beschwerden?',opts:['Ich habe Kopfschmerzen.','Ich bin ein Kopfschmerz.','Kopfschmerz hat ich.'],a:0,game:['Ich','habe','seit','gestern','Fieber.']},
{t:'Einkaufen & Reklamieren',icon:'🛍️',words:['umtauschen','Quittung','kaputt','Größe','zurückgeben'],learn:'Du kannst nach Produkten fragen und erklären, wenn etwas nicht in Ordnung ist.',ex:'Entschuldigung, die Jacke ist zu klein. Kann ich sie umtauschen?',q:'Die Ware ist kaputt. Was kannst du sagen?',opts:['Ich möchte das zurückgeben.','Ich gebe gestern kaufen.','Kaputt möchte Jacke.'],a:0,game:['Kann','ich','die','Jacke','umtauschen?']},
{t:'Reisen & Unterkunft',icon:'🧳',words:['reservieren','Übernachtung','Rezeption','Ankunft','Abfahrt'],learn:'Du buchst ein Zimmer und fragst nach wichtigen Reiseinformationen.',ex:'Ich möchte ein Doppelzimmer für zwei Nächte reservieren. Wann ist die Abreise?',q:'Wo meldest du dich im Hotel meistens an?',opts:['An der Rezeption.','An der Ampel.','In der Apotheke.'],a:0,game:['Ich','möchte','ein','Zimmer','reservieren.']},
{t:'Verkehr & Orientierung',icon:'🚆',words:['umsteigen','Haltestelle','Richtung','Verspätung','Fahrkarte'],learn:'Du fragst nach dem Weg und verstehst Informationen zu Bus und Bahn.',ex:'Sie müssen am Hauptbahnhof umsteigen. Der Zug hat zehn Minuten Verspätung.',q:'Was bedeutet „umsteigen“?',opts:['Das Verkehrsmittel wechseln.','Nach Hause schlafen.','Eine Fahrkarte essen.'],a:0,game:['Wo','muss','ich','umsteigen?']},
{t:'Freizeit & Einladungen',icon:'🎉',words:['einladen','feiern','mitbringen','teilnehmen','Ausflug'],learn:'Du lädst jemanden ein, reagierst auf Einladungen und planst Freizeit.',ex:'Ich feiere am Samstag Geburtstag. Möchtest du kommen? – Ja, gern! Soll ich etwas mitbringen?',q:'Wie nimmst du freundlich eine Einladung an?',opts:['Ja, gern!','Nein gestern.','Ich Einladung sein.'],a:0,game:['Möchtest','du','am','Samstag','mitkommen?']},
{t:'Meinung & Vergleiche',icon:'💬',words:['meiner Meinung nach','besser','wichtiger','lieber','weil'],learn:'Du äußerst einfache Meinungen, vergleichst Dinge und begründest sie.',ex:'Ich fahre lieber mit dem Zug, weil es bequemer ist.',q:'Welche Begründung ist richtig?',opts:['Ich bleibe zu Hause, weil ich krank bin.','Ich bleibe, weil bin ich krank.','Weil krank ich Hause.'],a:0,game:['Ich','lerne','Deutsch,','weil','ich','hier','lebe.']},
{t:'Briefe, E-Mail & Formulare',icon:'✉️',words:['Betreff','Anmeldung','ausfüllen','unterschreiben','Mit freundlichen Grüßen'],learn:'Du verstehst einfache Schreiben und kannst kurze formelle Nachrichten verfassen.',ex:'Sehr geehrte Damen und Herren, ich möchte einen Termin vereinbaren. Mit freundlichen Grüßen',q:'Was machst du mit einem Formular?',opts:['Ich fülle es aus.','Ich steige es um.','Ich koche es.'],a:0,game:['Bitte','füllen','Sie','das','Formular','aus.']},
{t:'A2 Wiederholung',icon:'🏆',words:['Perfekt','weil','Termin','Beruf','Reise'],learn:'Jetzt wiederholst du wichtige A2-Situationen und verbindest längere Sätze.',ex:'Gestern konnte ich nicht arbeiten, weil ich einen Termin beim Arzt hatte.',q:'Welcher Satz klingt richtig?',opts:['Ich komme später, weil mein Zug Verspätung hat.','Ich komme später, weil hat mein Zug Verspätung.','Weil Zug später ich.'],a:0,game:['Ich','komme','später,','weil','der','Bus','Verspätung','hat.']}
];
const root=document.getElementById('lessons');let done=JSON.parse(localStorage.getItem('deutschA2Done')||'[]');
function render(){root.innerHTML='';lessons.forEach((l,i)=>{const card=document.createElement('article');card.className='panel lesson '+(done.includes(i)?'done':'');card.innerHTML=`<span class="lesson-no">Lektion ${i+1}</span><h3>${l.icon} ${l.t}</h3><p>${l.learn}</p><div class="lesson-actions"><button class="btn primary" data-open>📖 Lernen</button><button class="btn" data-quiz>❓ Quiz</button><button class="btn" data-game>🎮 Spielen</button></div><div class="lesson-detail"></div>`;const detail=card.querySelector('.lesson-detail');card.querySelector('[data-open]').onclick=()=>{detail.classList.add('open');detail.innerHTML=`<strong>Wichtige Wörter</strong><p>${l.words.join(' · ')}</p><div class="example"><strong>Beispiel:</strong><br>${l.ex}</div><button class="btn primary" data-done>✓ Lektion abschließen</button>`;detail.querySelector('[data-done]').onclick=()=>complete(i)};card.querySelector('[data-quiz]').onclick=()=>{detail.classList.add('open');detail.innerHTML=`<strong>${l.q}</strong><div class="quiz-options">${l.opts.map((o,j)=>`<button class="btn" data-answer="${j}">${o}</button>`).join('')}</div><div class="feedback"></div>`;detail.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.answer===l.a;detail.querySelector('.feedback').textContent=ok?'✅ Richtig! Sehr gut.':'❌ Noch einmal versuchen.';if(ok)complete(i,false)})};card.querySelector('[data-game]').onclick=()=>{detail.classList.add('open');const mixed=[...l.game].sort(()=>Math.random()-.5);detail.innerHTML=`<strong>Baue den richtigen Satz:</strong><div class="word-game">${mixed.map(w=>`<button class="btn">${w}</button>`).join('')}</div><p class="example" data-built></p><button class="btn primary" data-reset>Neu mischen</button>`;let built=[];detail.querySelectorAll('.word-game button').forEach(b=>b.onclick=()=>{built.push(b.textContent);b.disabled=true;detail.querySelector('[data-built]').textContent=built.join(' ');if(built.length===l.game.length&&built.join(' ')===l.game.join(' ')){detail.querySelector('[data-built]').textContent+=' ✅';complete(i,false)}});detail.querySelector('[data-reset]').onclick=()=>render()};root.appendChild(card)});updateProgress()}
function complete(i,rerender=true){if(!done.includes(i)){done.push(i);localStorage.setItem('deutschA2Done',JSON.stringify(done))}updateProgress();if(rerender)render()}
function updateProgress(){document.getElementById('progressText').textContent=`${done.length} von 12 Lektionen`;document.getElementById('progressBar').style.width=(done.length/12*100)+'%'}render();
</script></body></html>
