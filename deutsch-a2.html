<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A2 interaktiv lernen</title><meta name="description" content="Deutsch A2 interaktiv mit Hören, Satztraining, Quiz und Punkten lernen."><link rel="stylesheet" href="styles.css"><style>.hero{padding:48px 0 18px}.course-progress{padding:18px;margin:20px 0}.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.lesson-card{padding:22px;cursor:pointer}.lesson-no{font-weight:800;color:#164f3f}.trainer{display:none;max-width:760px;margin:30px auto}.trainer.open{display:block}.trainer-card{padding:30px;text-align:center}.stepbar{display:flex;gap:6px;margin:18px 0}.stepdot{height:8px;flex:1;border-radius:20px;background:#e2e9e5}.stepdot.on{background:#164f3f}.big-icon{font-size:4rem}.big-sentence{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:850;margin:18px}.muted{color:#66756e}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.choice{display:grid;gap:10px;margin:20px 0}.choice button{padding:16px;text-align:left}.feedback{min-height:30px;font-weight:800}.hidden{display:none}.progress-track{height:10px;background:#e6ece9;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:#164f3f}.words{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.word{padding:10px 14px;background:#f2f7f4;border-radius:12px;font-weight:700}</style></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">🇩🇪 Test in Deutschland</a><nav><a href="deutsch-lernen.html">← Niveaus</a><a href="deutsch-a1.html">A1</a><a href="deutsch-b1.html">B1 →</a></nav></div></header><main class="wrap"><section class="hero"><span class="level-badge">A2</span><h1>Deutsch A2 – im Alltag sicherer werden</h1><p class="german-intro">Hören, Sätze verstehen, richtig antworten und selbst Sätze bauen.</p><div class="panel course-progress"><strong>⭐ <span id="xp">0</span> Punkte · <span id="progressText">0 von 12 Lektionen</span></strong><div class="progress-track" style="margin-top:10px"><div id="progressBar" class="progress-fill"></div></div></div></section><section id="overview"><h2>Wähle eine A2-Lektion</h2><div id="lessonGrid" class="lesson-grid"></div></section><section id="trainer" class="trainer"><button class="btn" id="back">← Lektionen</button><div class="panel trainer-card"><span id="lessonLabel" class="eyebrow"></span><div id="stepbar" class="stepbar"></div><div id="screen"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="btn primary">Weiter →</button></div></div></section></main><script>
const lessons=[['🕐','Über Vergangenes sprechen',['gestern','besucht','gefahren'],'Ich habe gestern meine Freundin besucht.',['Welcher Satz ist richtig?','Ich habe gestern gearbeitet.',['Ich gestern gearbeitet habe.','Ich habe gestern gearbeitet.','Ich hat gestern arbeiten.']],['Ich','habe','gestern','gekocht.']],['📅','Termine & Verabredungen',['Termin','verschieben','passen'],'Können wir den Termin auf Freitag verschieben?',['Du kannst nicht kommen. Was passt?','Können wir den Termin verschieben?',['Ich verschiebe gestern.','Können wir den Termin verschieben?','Der Termin kann essen.']],['Können','wir','uns','morgen','treffen?']],['🏠','Wohnen & Nachbarschaft',['Nachbar','Miete','ruhig'],'Meine Wohnung ist ruhig, aber oben ist es manchmal laut.',['Was ist ein Nachbar?','Eine Person, die neben dir wohnt.',['Ein Verkehrsmittel.','Eine Person, die neben dir wohnt.','Ein Lebensmittel.']],['Meine','Wohnung','ist','sehr','ruhig.']],['💼','Arbeit & Beruf',['Bewerbung','Arbeitszeit','Erfahrung'],'Ich arbeite seit zwei Jahren als Verkäufer.',['Welcher Satz beschreibt Erfahrung?','Ich arbeite seit zwei Jahren hier.',['Ich arbeite morgen gestern.','Ich arbeite seit zwei Jahren hier.','Ich zwei Jahre Arbeit.']],['Ich','habe','Erfahrung','im','Verkauf.']],['🩺','Beim Arzt',['Schmerzen','Rezept','Tablette'],'Ich habe seit drei Tagen Halsschmerzen.',['Was sagst du bei Beschwerden?','Ich habe Kopfschmerzen.',['Ich bin ein Kopfschmerz.','Ich habe Kopfschmerzen.','Kopfschmerz hat ich.']],['Ich','habe','seit','gestern','Fieber.']],['🛍️','Einkaufen & Reklamieren',['umtauschen','Quittung','kaputt'],'Die Jacke ist zu klein. Kann ich sie umtauschen?',['Die Ware ist kaputt. Was sagst du?','Ich möchte das zurückgeben.',['Ich möchte das zurückgeben.','Kaputt möchte Jacke.','Ich gebe gestern kaufen.']],['Kann','ich','die','Jacke','umtauschen?']],['🧳','Reisen & Unterkunft',['reservieren','Rezeption','Abfahrt'],'Ich möchte ein Zimmer für zwei Nächte reservieren.',['Wo meldest du dich im Hotel an?','An der Rezeption.',['An der Ampel.','In der Apotheke.','An der Rezeption.']],['Ich','möchte','ein','Zimmer','reservieren.']],['🚆','Verkehr & Orientierung',['umsteigen','Verspätung','Fahrkarte'],'Der Zug hat zehn Minuten Verspätung.',['Was bedeutet umsteigen?','Das Verkehrsmittel wechseln.',['Das Verkehrsmittel wechseln.','Eine Fahrkarte essen.','Nach Hause schlafen.']],['Wo','muss','ich','umsteigen?']],['🎉','Freizeit & Einladungen',['einladen','mitbringen','Ausflug'],'Möchtest du am Samstag zu meiner Feier kommen?',['Wie nimmst du freundlich an?','Ja, gern!',['Nein gestern.','Ja, gern!','Ich Einladung sein.']],['Möchtest','du','am','Samstag','mitkommen?']],['💬','Meinung & Begründen',['Meinung','lieber','weil'],'Ich fahre lieber mit dem Zug, weil es bequemer ist.',['Welcher Satz ist richtig?','Ich bleibe zu Hause, weil ich krank bin.',['Ich bleibe, weil bin ich krank.','Ich bleibe zu Hause, weil ich krank bin.','Weil krank ich Hause.']],['Ich','lerne','Deutsch,','weil','ich','hier','lebe.']],['✉️','E-Mail & Formulare',['Betreff','ausfüllen','unterschreiben'],'Ich möchte einen Termin vereinbaren. Mit freundlichen Grüßen',['Was machst du mit einem Formular?','Ich fülle es aus.',['Ich koche es.','Ich fülle es aus.','Ich steige es um.']],['Bitte','füllen','Sie','das','Formular','aus.']],['🏆','A2 Wiederholung',['Perfekt','weil','Termin'],'Ich komme später, weil mein Zug Verspätung hat.',['Welcher Satz ist richtig?','Ich komme später, weil mein Zug Verspätung hat.',['Ich komme später, weil hat mein Zug Verspätung.','Weil Zug später ich.','Ich komme später, weil mein Zug Verspätung hat.']],['Ich','komme','später,','weil','der','Bus','Verspätung','hat.']]];
let current=0,step=0,xp=+(localStorage.getItem('a2xp')||0),done=JSON.parse(localStorage.getItem('deutschA2Done')||'[]'),built=[];const grid=document.getElementById('lessonGrid'),screen=document.getElementById('screen'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function overview(){grid.innerHTML='';lessons.forEach((l,i)=>{let c=document.createElement('article');c.className='panel lesson-card';c.innerHTML=`<span class="lesson-no">Lektion ${i+1} ${done.includes(i)?'✓':''}</span><div class="big-icon">${l[0]}</div><h3>${l[1]}</h3><p>${done.includes(i)?'Wiederholen':'Interaktiv lernen'}</p>`;c.onclick=()=>openLesson(i);grid.appendChild(c)});update()}
function openLesson(i){current=i;step=0;built=[];document.getElementById('overview').style.display='none';document.getElementById('trainer').classList.add('open');document.getElementById('lessonLabel').textContent=`Lektion ${i+1} · ${lessons[i][1]}`;render()}function dots(){document.getElementById('stepbar').innerHTML=[0,1,2,3,4].map(i=>`<span class="stepdot ${i<=step?'on':''}"></span>`).join('')}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;speechSynthesis.speak(u)}}
function render(){dots();feedback.textContent='';next.classList.remove('hidden');let l=lessons[current];if(step===0){screen.innerHTML=`<div class="big-icon">${l[0]}</div><h2>Neue Wörter</h2><div class="words">${l[2].map(w=>`<span class="word">${w}</span>`).join('')}</div><p class="muted">Lies die Wörter laut.</p>`}else if(step===1){screen.innerHTML=`<h2>👂 Hören & verstehen</h2><div class="big-sentence">${l[3]}</div><div class="actions"><button class="btn" id="listen">🔊 Anhören</button></div>`;document.getElementById('listen').onclick=()=>speak(l[3])}else if(step===2){next.classList.add('hidden');let q=l[4];screen.innerHTML=`<h2>❓ Verstehst du es?</h2><h3>${q[0]}</h3><div class="choice">${q[2].map(o=>`<button class="btn answer">${o}</button>`).join('')}</div>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(b.textContent===q[1]){feedback.textContent='✅ Richtig! +10 Punkte';xp+=10;saveXp();next.classList.remove('hidden')}else feedback.textContent='❌ Noch nicht. Versuch es erneut.'})}else if(step===3){next.classList.add('hidden');built=[];let words=[...l[5]].sort(()=>Math.random()-.5);screen.innerHTML=`<h2>🧩 Baue den Satz</h2><div class="words">${words.map(w=>`<button class="btn piece">${w}</button>`).join('')}</div><div id="built" class="big-sentence"></div><button id="reset" class="btn">↻ Neu</button>`;document.querySelectorAll('.piece').forEach(b=>b.onclick=()=>{built.push(b.textContent);b.disabled=true;document.getElementById('built').textContent=built.join(' ');if(built.length===l[5].length){if(built.join(' ')===l[5].join(' ')){feedback.textContent='✅ Perfekt! +15 Punkte';xp+=15;saveXp();next.classList.remove('hidden')}else feedback.textContent='❌ Reihenfolge stimmt noch nicht.'}});document.getElementById('reset').onclick=render}else{screen.innerHTML=`<div class="big-icon">🎉</div><h2>A2-Lektion geschafft!</h2><p>Du hast Wörter, Hören, Verständnis und Satzbau trainiert.</p><div class="big-sentence">+25 ⭐</div>`;if(!done.includes(current)){done.push(current);xp+=25;localStorage.setItem('deutschA2Done',JSON.stringify(done));saveXp()}next.textContent='Fertig ✓'}}function saveXp(){localStorage.setItem('a2xp',xp);update()}function update(){document.getElementById('xp').textContent=xp;document.getElementById('progressText').textContent=`${done.length} von 12 Lektionen`;document.getElementById('progressBar').style.width=(done.length/12*100)+'%'}next.onclick=()=>{if(step<4){step++;next.textContent='Weiter →';render()}else{document.getElementById('trainer').classList.remove('open');document.getElementById('overview').style.display='block';overview()}};document.getElementById('back').onclick=()=>{document.getElementById('trainer').classList.remove('open');document.getElementById('overview').style.display='block';overview()};overview();
</script></body></html>
