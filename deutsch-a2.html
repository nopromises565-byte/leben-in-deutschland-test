<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A2 lernen</title><link rel="stylesheet" href="styles.css"><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:#f8fbf9;color:var(--ink)}.appbar{background:#fff;border-bottom:1px solid #e5ece8}.appbar .nav{min-height:64px}.brand2{font-size:1.18rem;font-weight:950;color:var(--ink);text-decoration:none}.tabs{display:flex;gap:4px;align-items:center}.tabs a{padding:8px 18px;border-radius:22px;text-decoration:none;color:var(--ink);font-weight:900}.tabs a.active{background:var(--g);color:#fff}.heroA{height:155px;background:linear-gradient(105deg,#066846,#159465);color:#fff;padding:34px 0 0}.heroA h1{font-size:3rem;margin:0;font-weight:950;line-height:1}.heroA h1 b{color:#ffd33e}.heroA p{font-size:.98rem;margin:10px 0 0;font-weight:700}.dashboard{margin-top:-18px;position:relative}.summary{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 25px #163b2d18;padding:8px 16px;display:grid;grid-template-columns:2fr 1fr 1fr 1.35fr;align-items:center;min-height:68px}.sum{padding:4px 18px;border-left:1px solid #dfe8e4;font-size:.9rem}.sum:first-child{border:0}.sum strong{font-size:1.04rem;display:block}.progress-track{height:6px;background:#e4ece8;border-radius:99px;overflow:hidden;margin-top:6px}.progress-fill{height:100%;background:#129b5d}.course{margin:12px 0 40px}.chapter{border:1px solid var(--line);border-radius:21px;padding:10px 13px;margin:10px 0;background:linear-gradient(90deg,#f1fbf6,#fff);box-shadow:0 4px 14px #12392d0c}.chapter:nth-child(even){background:linear-gradient(90deg,#fff9ed,#fff)}.chapter-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}.chapter-no{width:40px;height:40px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.25rem;font-weight:950}.chapter-head h2{margin:0;font-size:1.3rem}.chapter-head p{margin:1px 0;color:#52665e;font-size:.85rem}.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.lesson{background:#fff;border:1px solid #e0e8e4;border-radius:15px;padding:8px 10px;display:grid;grid-template-columns:42px 1fr 38px;gap:8px;align-items:center;cursor:pointer}.lesson-icon{width:40px;height:40px;border-radius:12px;background:#eaf6f0;display:grid;place-items:center;font-size:1.35rem}.lesson h3{font-size:.9rem;margin:1px 0}.lesson small{color:var(--g);font-weight:900;font-size:.72rem}.lesson p{font-size:.73rem;color:#60716a;margin:3px 0}.mini-track{height:5px;background:#e5ece8;border-radius:9px}.mini-fill{height:100%;background:var(--g)}.play{width:36px;height:36px;border:0;border-radius:50%;background:var(--g);color:#fff}.trainer{display:none;max-width:780px;margin:28px auto}.trainer.open{display:block}.train-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;text-align:center}.steps{display:flex;gap:4px;margin:13px 0}.steps i{height:6px;flex:1;background:#e3ebe7;border-radius:9px}.steps i.on{background:var(--g)}.big{font-size:2.2rem;font-weight:900;margin:15px}.choices{display:grid;gap:8px;margin:16px 0}.feedback{min-height:26px;font-weight:800}.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.chips span,.chips button{background:#edf6f1;padding:9px 12px;border-radius:11px;font-weight:800}.meta{color:#687970;font-weight:700}.hidden{display:none}@media(max-width:900px){.summary{grid-template-columns:1fr 1fr}.lessons{grid-template-columns:1fr}.sum{border:0}.tabs{display:none}}@media(max-width:600px){.summary{grid-template-columns:1fr}.heroA h1{font-size:2.4rem}}</style></head><body><header class="appbar"><div class="wrap nav"><a class="brand2" href="deutsch-lernen.html">📖 Deutsch lernen</a><nav class="tabs"><a href="deutsch-a1.html">A1</a><a class="active" href="deutsch-a2.html">A2</a><a href="deutsch-b1.html">B1</a><a href="index.html">🎯 Übungen</a><a href="index.html#pruefung">🎓 Tests</a></nav><div>⭐ <b id="xpTop">0</b> Punkte</div></div></header><section class="heroA"><div class="wrap"><h1>Deutsch <b>A2</b></h1><p>Aufbaustufe – im Alltag sicherer sprechen, verstehen und schreiben</p></div></section><main class="wrap dashboard"><section class="summary"><div class="sum"><strong>📖 Dein Fortschritt · <span id="percent">0%</span></strong><div class="progress-track"><div id="progressBar" class="progress-fill"></div></div></div><div class="sum"><strong>📚 12</strong>Lektionen</div><div class="sum"><strong>☑️ 240</strong>Aufgaben</div><div class="sum"><strong>🏅 A2-Zertifikat</strong>nach Abschluss</div></section><section id="overview" class="course"></section><section id="trainer" class="trainer"><button class="btn" id="back">← Übersicht</button><div class="train-card"><b id="label"></b><div id="count" class="meta"></div><div id="bars" class="steps"></div><div id="screen"></div><div id="feedback" class="feedback"></div><button id="next" class="btn primary">Weiter →</button></div></section></main><script>const data=[['🕐','Vergangenheit','Erzählen, was passiert ist',['gestern','besucht','gefahren','gemacht','gewesen'],'Ich habe gestern meine Freundin besucht.',['Welcher Satz ist richtig?','Ich habe gestern gearbeitet.'],['Ich','habe','gestern','gekocht.']],['📅','Termine','Verabreden, absagen, verschieben',['Termin','verschieben','passen','verabreden','Uhrzeit'],'Können wir den Termin auf Freitag verschieben?',['Was sagst du bei einer Änderung?','Können wir den Termin verschieben?'],['Können','wir','uns','morgen','treffen?']],['🏠','Nachbarschaft','Wohnen und höflich Probleme klären',['Nachbar','Miete','Hausordnung','laut','ruhig'],'Meine Wohnung ist ruhig, aber oben ist es laut.',['Wer wohnt neben dir?','Mein Nachbar.'],['Meine','Wohnung','ist','sehr','ruhig.']],['💼','Arbeit & Bewerbung','Berufserfahrung und Aufgaben',['Bewerbung','Arbeitszeit','Erfahrung','Aufgabe','Kollege'],'Ich arbeite seit zwei Jahren im Verkauf.',['Was beschreibt Erfahrung?','Ich arbeite seit zwei Jahren hier.'],['Ich','habe','Erfahrung','im','Verkauf.']],['🩺','Beim Arzt','Beschwerden genauer erklären',['Schmerzen','Rezept','Untersuchung','Tablette','Fieber'],'Ich habe seit drei Tagen Halsschmerzen.',['Was sagst du bei Beschwerden?','Ich habe Kopfschmerzen.'],['Ich','habe','seit','gestern','Fieber.']],['🛍️','Reklamieren','Umtausch und Probleme im Geschäft',['umtauschen','Quittung','kaputt','Größe','zurückgeben'],'Die Jacke ist zu klein. Kann ich sie umtauschen?',['Was sagst du bei kaputter Ware?','Ich möchte das zurückgeben.'],['Kann','ich','die','Jacke','umtauschen?']],['🧳','Reisen','Hotel und Reiseinformationen',['reservieren','Rezeption','Ankunft','Abfahrt','Übernachtung'],'Ich möchte ein Zimmer für zwei Nächte reservieren.',['Wo meldest du dich im Hotel an?','An der Rezeption.'],['Ich','möchte','ein','Zimmer','reservieren.']],['🚆','Verkehr','Umsteigen und Verspätungen',['umsteigen','Verspätung','Fahrkarte','Richtung','Gleis'],'Der Zug hat zehn Minuten Verspätung.',['Was bedeutet umsteigen?','Das Verkehrsmittel wechseln.'],['Wo','muss','ich','umsteigen?']],['🎉','Einladungen','Pläne machen und reagieren',['einladen','mitbringen','teilnehmen','feiern','Ausflug'],'Möchtest du am Samstag zu meiner Feier kommen?',['Wie sagst du freundlich zu?','Ja, gern!'],['Möchtest','du','am','Samstag','mitkommen?']],['💬','Meinung sagen','Begründen und vergleichen',['Meinung','lieber','besser','wichtiger','weil'],'Ich fahre lieber mit dem Zug, weil es bequemer ist.',['Wie begründest du?','Ich bleibe zu Hause, weil ich krank bin.'],['Ich','lerne','Deutsch,','weil','ich','hier','lebe.']],['✉️','E-Mail & Formulare','Schriftlich im Alltag klarkommen',['Betreff','Anmeldung','ausfüllen','unterschreiben','Grüße'],'Bitte füllen Sie das Formular aus.',['Was machst du mit einem Formular?','Ich fülle es aus.'],['Bitte','füllen','Sie','das','Formular','aus.']],['🏆','A2 Abschluss','Alles verbinden und wiederholen',['Perfekt','weil','Termin','Beruf','Reise'],'Ich komme später, weil mein Zug Verspätung hat.',['Welcher Satz ist richtig?','Ich komme später, weil mein Zug Verspätung hat.'],['Ich','komme','später,','weil','der','Bus','Verspätung','hat.']]];const groups=[['Erzählen & planen','Vergangenheit, Termine und Wohnen.',0,3],['Alltag regeln','Arbeit, Gesundheit und Einkaufen.',3,6],['Unterwegs & gemeinsam','Reisen, Verkehr und Einladungen.',6,9],['Sicher kommunizieren','Meinung, Schreiben und Abschluss.',9,12]];let done=JSON.parse(localStorage.getItem('deutschA2Done')||'[]'),xp=+(localStorage.getItem('a2xp')||0),cur=0,step=0,built=[];const overview=document.getElementById('overview'),trainer=document.getElementById('trainer'),screen=document.getElementById('screen'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function draw(){overview.innerHTML='';groups.forEach((g,gi)=>{let s=document.createElement('section');s.className='chapter';s.innerHTML=`<div class="chapter-head"><span class="chapter-no">${gi+1}</span><div><h2>${g[0]}</h2><p>${g[1]}</p></div></div><div class="lessons"></div>`;let box=s.querySelector('.lessons');for(let i=g[2];i<g[3];i++){let l=data[i],el=document.createElement('article');el.className='lesson';el.innerHTML=`<div class="lesson-icon">${done.includes(i)?'✓':l[0]}</div><div><small>Lektion ${i+1}</small><h3>${l[1]}</h3><p>${l[2]}</p><div class="mini-track"><div class="mini-fill" style="width:${done.includes(i)?100:0}%"></div></div><p>${done.includes(i)?'20 / 20':'0 / 20'} Aufgaben</p></div><button class="play">▶</button>`;el.onclick=()=>open(i);box.appendChild(el)}overview.appendChild(s)});update()}function open(i){cur=i;step=0;overview.style.display='none';trainer.classList.add('open');render()}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}}function options(q,correct,opts){next.classList.add('hidden');screen.innerHTML=`<h2>❓ ${q}</h2><div class="choices">${opts.map(x=>`<button class="btn">${x}</button>`).join('')}</div>`;screen.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.textContent===correct){feedback.textContent='✅ Richtig! +5 Punkte';xp+=5;save();next.classList.remove('hidden')}else feedback.textContent='❌ Noch nicht. Versuch es erneut.'})}function render(){let l=data[cur],phase=step%10,w=l[3][step%l[3].length];label.textContent=`LEKTION ${cur+1} · ${l[1]}`;count.textContent=`Aufgabe ${step+1} von 20`;bars.innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');feedback.textContent='';next.classList.remove('hidden');next.textContent='Weiter →';if(phase===0||phase===5){screen.innerHTML=`<h2>📚 Wortschatz</h2><div class="big">${w}</div><button class="btn" id="listen">🔊 Anhören</button>`;listen.onclick=()=>speak(w)}else if(phase===1||phase===6){screen.innerHTML=`<h2>👂 Hören & nachsprechen</h2><div class="big">${l[4]}</div><button class="btn" id="listen">🔊 Anhören</button>`;listen.onclick=()=>speak(l[4])}else if(phase===2||phase===7){options(l[5][0],l[5][1],[l[5][1],l[3][0],l[4]].sort(()=>Math.random()-.5))}else if(phase===3){next.classList.add('hidden');built=[];let words=[...l[6]].sort(()=>Math.random()-.5);screen.innerHTML=`<h2>🧩 Baue den Satz</h2><div class="chips">${words.map(x=>`<button class="btn piece">${x}</button>`).join('')}</div><div id="built" class="big"></div><button id="reset" class="btn">↻ Neu</button>`;screen.querySelectorAll('.piece').forEach(b=>b.onclick=()=>{built.push(b.textContent);b.disabled=true;document.getElementById('built').textContent=built.join(' ');if(built.length===l[6].length){if(built.join(' ')===l[6].join(' ')){feedback.textContent='✅ Perfekt! +10 Punkte';xp+=10;save();next.classList.remove('hidden')}else feedback.textContent='❌ Reihenfolge stimmt noch nicht.'}});reset.onclick=render}else if(phase===8){options('Welches Wort gehört zum Thema?',l[3][2],[l[3][2],'Banane','Fenster'].sort(()=>Math.random()-.5))}else{screen.innerHTML=`<h2>🎯 Sprachtraining</h2><div class="chips">${l[3].map(x=>`<span>${x}</span>`).join('')}</div><p>Sprich die Wörter laut und wiederhole den Satz.</p><button class="btn" id="listen">🔊 Beispielsatz</button>`;listen.onclick=()=>speak(l[4])}}next.onclick=()=>{if(step<19){step++;render()}else{if(!done.includes(cur)){done.push(cur);xp+=40;localStorage.setItem('deutschA2Done',JSON.stringify(done));save()}trainer.classList.remove('open');overview.style.display='block';draw()}};back.onclick=()=>{trainer.classList.remove('open');overview.style.display='block';draw()};function save(){localStorage.setItem('a2xp',xp);update()}function update(){let p=Math.round(done.length/12*100);document.getElementById('xpTop').textContent=xp;document.getElementById('percent').textContent=p+'%';document.getElementById('progressBar').style.width=p+'%'}draw();</script></body></html>
