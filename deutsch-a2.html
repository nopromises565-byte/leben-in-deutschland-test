<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A2 Lernpfad</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8f7}.hero{padding:42px 0 10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid #e2e9e5;border-radius:18px;padding:12px 18px;font-weight:800}.world{max-width:780px;margin:34px auto}.world-head{background:linear-gradient(135deg,#174d68,#217c86);color:#fff;border-radius:24px;padding:24px;margin-bottom:22px}.world-head h2{margin:4px 0}.path{position:relative;padding:8px 0 32px}.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;background:#dce8e2;transform:translateX(-50%);border-radius:9px}.node{position:relative;display:flex;align-items:center;gap:20px;margin:28px 0;z-index:1}.node:nth-child(even){flex-direction:row-reverse}.orb{width:104px;height:104px;min-width:104px;border-radius:50%;background:#1b6872;color:#fff;border:8px solid #e0eff0;display:grid;place-items:center;font-size:2.6rem;box-shadow:0 7px 20px #173c2d22;cursor:pointer}.node-info{background:#fff;border:1px solid #dfe8e3;border-radius:20px;padding:16px 18px;width:calc(50% - 72px);box-shadow:0 5px 18px #173c2d0d}.node-info h3{margin:2px 0 5px}.meta{font-size:.85rem;color:#60716a}.done .orb{background:#e0a91b}.trainer{display:none;max-width:760px;margin:28px auto}.trainer.open{display:block}.card{background:#fff;border:1px solid #dfe8e3;border-radius:26px;padding:30px;text-align:center}.steps{display:flex;gap:4px;margin:15px 0}.steps i{height:7px;flex:1;background:#e2e9e5;border-radius:8px}.steps i.on{background:#1b6872}.big{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:900;margin:18px}.icon{font-size:4rem}.choices{display:grid;gap:10px;margin:20px 0}.choices button{padding:16px}.feedback{min-height:28px;font-weight:800}.hidden{display:none}.chips{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.chips span,.chips button{background:#edf5f5;padding:11px 15px;border-radius:14px;font-weight:800}@media(max-width:650px){.node,.node:nth-child(even){flex-direction:row}.path:before{left:52px}.orb{width:82px;height:82px;min-width:82px}.node-info{width:auto;flex:1}}</style></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">🇩🇪 Test in Deutschland</a><nav><a href="deutsch-lernen.html">← Niveaus</a><a href="deutsch-a1.html">← A1</a><a href="deutsch-b1.html">B1 →</a></nav></div></header><main class="wrap"><section class="hero"><span class="level-badge">A2</span><h1>Dein A2-Lernpfad</h1><p>Mehr Alltag, längere Sätze und echtes Sprachtraining mit <strong>20 Aufgaben pro Lektion</strong>.</p><div class="stats"><div class="stat">⭐ <span id="xp">0</span> Punkte</div><div class="stat">🏆 <span id="progress">0 / 12</span> geschafft</div><div class="stat">🎯 240 Aufgaben</div></div></section><section id="overview"></section><section id="trainer" class="trainer"><button class="btn" id="back">← Lernpfad</button><div class="card"><b id="label"></b><div id="count" class="meta"></div><div id="bars" class="steps"></div><div id="screen"></div><div id="feedback" class="feedback"></div><button id="next" class="btn primary">Weiter →</button></div></section></main><script>
const data=[['🕐','Vergangenheit','Erzählen, was passiert ist',['gestern','besucht','gefahren','gemacht','gewesen'],'Ich habe gestern meine Freundin besucht.',['Welcher Satz ist richtig?','Ich habe gestern gearbeitet.'],['Ich','habe','gestern','gekocht.']],['📅','Termine','Verabreden, absagen, verschieben',['Termin','verschieben','passen','verabreden','Uhrzeit'],'Können wir den Termin auf Freitag verschieben?',['Was sagst du bei einer Änderung?','Können wir den Termin verschieben?'],['Können','wir','uns','morgen','treffen?']],['🏠','Nachbarschaft','Wohnen und höflich Probleme klären',['Nachbar','Miete','Hausordnung','laut','ruhig'],'Meine Wohnung ist ruhig, aber oben ist es laut.',['Wer wohnt neben dir?','Mein Nachbar.'],['Meine','Wohnung','ist','sehr','ruhig.']],['💼','Arbeit & Bewerbung','Berufserfahrung und Aufgaben',['Bewerbung','Arbeitszeit','Erfahrung','Aufgabe','Kollege'],'Ich arbeite seit zwei Jahren im Verkauf.',['Was beschreibt Erfahrung?','Ich arbeite seit zwei Jahren hier.'],['Ich','habe','Erfahrung','im','Verkauf.']],['🩺','Beim Arzt','Beschwerden genauer erklären',['Schmerzen','Rezept','Untersuchung','Tablette','Fieber'],'Ich habe seit drei Tagen Halsschmerzen.',['Was sagst du bei Beschwerden?','Ich habe Kopfschmerzen.'],['Ich','habe','seit','gestern','Fieber.']],['🛍️','Reklamieren','Umtausch und Probleme im Geschäft',['umtauschen','Quittung','kaputt','Größe','zurückgeben'],'Die Jacke ist zu klein. Kann ich sie umtauschen?',['Was sagst du bei kaputter Ware?','Ich möchte das zurückgeben.'],['Kann','ich','die','Jacke','umtauschen?']],['🧳','Reisen','Hotel und Reiseinformationen',['reservieren','Rezeption','Ankunft','Abfahrt','Übernachtung'],'Ich möchte ein Zimmer für zwei Nächte reservieren.',['Wo meldest du dich im Hotel an?','An der Rezeption.'],['Ich','möchte','ein','Zimmer','reservieren.']],['🚆','Verkehr','Umsteigen und Verspätungen',['umsteigen','Verspätung','Fahrkarte','Richtung','Gleis'],'Der Zug hat zehn Minuten Verspätung.',['Was bedeutet umsteigen?','Das Verkehrsmittel wechseln.'],['Wo','muss','ich','umsteigen?']],['🎉','Einladungen','Pläne machen und reagieren',['einladen','mitbringen','teilnehmen','feiern','Ausflug'],'Möchtest du am Samstag zu meiner Feier kommen?',['Wie sagst du freundlich zu?','Ja, gern!'],['Möchtest','du','am','Samstag','mitkommen?']],['💬','Meinung sagen','Begründen und vergleichen',['Meinung','lieber','besser','wichtiger','weil'],'Ich fahre lieber mit dem Zug, weil es bequemer ist.',['Wie begründest du?','Ich bleibe zu Hause, weil ich krank bin.'],['Ich','lerne','Deutsch,','weil','ich','hier','lebe.']],['✉️','E-Mail & Formulare','Schriftlich im Alltag klarkommen',['Betreff','Anmeldung','ausfüllen','unterschreiben','Grüße'],'Bitte füllen Sie das Formular aus.',['Was machst du mit einem Formular?','Ich fülle es aus.'],['Bitte','füllen','Sie','das','Formular','aus.']],['🏆','A2 Abschluss','Alles verbinden und wiederholen',['Perfekt','weil','Termin','Beruf','Reise'],'Ich komme später, weil mein Zug Verspätung hat.',['Welcher Satz ist richtig?','Ich komme später, weil mein Zug Verspätung hat.'],['Ich','komme','später,','weil','der','Bus','Verspätung','hat.']]];
const groups=[['🗣️','Erzählen & planen','Vergangenheit, Termine und Wohnen',0,3],['💼','Alltag regeln','Arbeit, Gesundheit und Einkaufen',3,6],['🧳','Unterwegs & gemeinsam','Reisen, Verkehr und Einladungen',6,9],['✍️','Sicher kommunizieren','Meinung, Schreiben und Abschluss',9,12]];let done=JSON.parse(localStorage.getItem('deutschA2Done')||'[]'),xp=+(localStorage.getItem('a2xp')||0),cur=0,step=0,built=[];const overview=document.getElementById('overview'),trainer=document.getElementById('trainer'),screen=document.getElementById('screen'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function draw(){overview.innerHTML='';groups.forEach(g=>{let s=document.createElement('section');s.className='world';s.innerHTML=`<div class="world-head"><small>THEMENWELT</small><h2>${g[0]} ${g[1]}</h2><div>${g[2]}</div></div><div class="path"></div>`;let p=s.querySelector('.path');for(let i=g[3];i<g[4];i++){let l=data[i],n=document.createElement('div');n.className='node '+(done.includes(i)?'done':'');n.innerHTML=`<button class="orb">${done.includes(i)?'✓':l[0]}</button><div class="node-info"><b>LEKTION ${i+1}</b><h3>${l[1]}</h3><div>${l[2]}</div><p class="meta">20 Aufgaben · 🔊 Hören · 🧩 Satzbau · ❓ Quiz</p></div>`;n.onclick=()=>open(i);p.appendChild(n)}overview.appendChild(s)});update()}function open(i){cur=i;step=0;overview.style.display='none';trainer.classList.add('open');render()}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}function options(q,correct,opts){next.classList.add('hidden');screen.innerHTML=`<h2>❓ ${q}</h2><div class="choices">${opts.map(x=>`<button class="btn">${x}</button>`).join('')}</div>`;screen.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.textContent===correct){feedback.textContent='✅ Richtig! +5 Punkte';xp+=5;save();next.classList.remove('hidden')}else feedback.textContent='❌ Noch nicht. Versuch es erneut.'})}function render(){let l=data[cur],phase=step%10,w=l[3][step%l[3].length];label.textContent=`LEKTION ${cur+1} · ${l[1]}`;count.textContent=`Aufgabe ${step+1} von 20`;bars.innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');feedback.textContent='';next.classList.remove('hidden');next.textContent='Weiter →';if(phase===0||phase===5){screen.innerHTML=`<div class="icon">${l[0]}</div><h2>📚 Wortschatz</h2><div class="big">${w}</div><button class="btn" id="listen">🔊 Anhören</button>`;listen.onclick=()=>speak(w)}else if(phase===1||phase===6){screen.innerHTML=`<h2>👂 Hören & nachsprechen</h2><div class="big">${l[4]}</div><button class="btn" id="listen">🔊 Anhören</button>`;listen.onclick=()=>speak(l[4])}else if(phase===2||phase===7){options(l[5][0],l[5][1],[l[5][1],l[3][0],l[4]].sort(()=>Math.random()-.5))}else if(phase===3){next.classList.add('hidden');built=[];let words=[...l[6]].sort(()=>Math.random()-.5);screen.innerHTML=`<h2>🧩 Baue den Satz</h2><div class="chips">${words.map(x=>`<button class="btn piece">${x}</button>`).join('')}</div><div id="built" class="big"></div><button id="reset" class="btn">↻ Neu</button>`;screen.querySelectorAll('.piece').forEach(b=>b.onclick=()=>{built.push(b.textContent);b.disabled=true;document.getElementById('built').textContent=built.join(' ');if(built.length===l[6].length){if(built.join(' ')===l[6].join(' ')){feedback.textContent='✅ Perfekt! +10 Punkte';xp+=10;save();next.classList.remove('hidden')}else feedback.textContent='❌ Reihenfolge stimmt noch nicht.'}});reset.onclick=render}else if(phase===8){options('Welches Wort gehört zum Thema?',l[3][2],[l[3][2],'Banane','Fenster'].sort(()=>Math.random()-.5))}else{screen.innerHTML=`<h2>🎯 Sprachtraining</h2><div class="chips">${l[3].map(x=>`<span>${x}</span>`).join('')}</div><p>Sprich die Wörter laut und wiederhole danach den Satz.</p><button class="btn" id="listen">🔊 Beispielsatz</button>`;listen.onclick=()=>speak(l[4])}}next.onclick=()=>{if(step<19){step++;render()}else{if(!done.includes(cur)){done.push(cur);xp+=40;localStorage.setItem('deutschA2Done',JSON.stringify(done));save()}trainer.classList.remove('open');overview.style.display='block';draw()}};back.onclick=()=>{trainer.classList.remove('open');overview.style.display='block';draw()};function save(){localStorage.setItem('a2xp',xp);update()}function update(){document.getElementById('xp').textContent=xp;document.getElementById('progress').textContent=`${done.length} / 12`}draw();</script></body></html>
