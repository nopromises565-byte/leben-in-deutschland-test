<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 Lesen – Prüfungstraining</title><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2;--gold:#d7a72f}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:0 14px}.top{background:#fff;border-bottom:1px solid #e5ece8}.nav{min-height:58px;display:flex;align-items:center;gap:12px}.brand{font-weight:950;color:var(--ink);text-decoration:none}.back{margin-left:auto;color:var(--g);font-weight:900;text-decoration:none}.hero{background:linear-gradient(105deg,#066846,#159465);color:#fff;padding:28px 0}.hero h1{margin:0;font-size:2rem}.hero p{margin:7px 0 0;font-weight:700}.progress{height:8px;background:#dfe9e4;border-radius:20px;overflow:hidden;margin:18px 0 8px}.bar{height:100%;background:var(--g);width:0;transition:.3s}.count{text-align:right;color:#66766f;font-size:.82rem;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 5px 18px #0b56300c}.tag{display:inline-block;background:#e9f6ef;color:var(--g);padding:6px 10px;border-radius:20px;font-size:.75rem;font-weight:900}.card h2{font-size:1.3rem;margin:12px 0 8px}.text{background:#f6f9f7;border-left:4px solid var(--g);padding:15px;border-radius:10px;line-height:1.5;margin:12px 0 18px}.answers{display:grid;gap:9px}.answer{width:100%;text-align:left;padding:13px 14px;border:2px solid #dfe8e4;border-radius:12px;background:#fff;font-size:.96rem;font-weight:750;color:var(--ink);cursor:pointer}.answer:hover{border-color:#8dcbb0}.answer.ok{border-color:#159465;background:#edf9f3}.answer.bad{border-color:#d45b5b;background:#fff2f2}.feedback{min-height:28px;margin:12px 0 4px;font-weight:900}.next{display:none;width:100%;border:0;border-radius:12px;padding:13px;background:var(--g);color:#fff;font-size:1rem;font-weight:900;cursor:pointer}.result{text-align:center}.score{font-size:3rem;font-weight:950;color:var(--g);margin:10px}.small{color:#66766f}.restart{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;background:var(--g);color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.hero{padding:22px 0}.hero h1{font-size:1.65rem}.card{padding:15px;border-radius:17px}.text{font-size:.94rem}.answer{font-size:.9rem;padding:12px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="telc-training.html">📖 A1 Training</a><a class="back" href="telc-training.html">← Übersicht</a></div></header><section class="hero"><div class="wrap"><h1>📖 A1 · Lesen</h1><p>Kurze Alltagstexte verstehen und wichtige Informationen finden.</p></div></section><main class="wrap"><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div><section id="card" class="card"></section></main><script>const tasks=[{t:'Schild',x:'APOTHEKE – Montag bis Freitag 8:00–18:00 Uhr. Samstag 9:00–13:00 Uhr.',q:'Wann ist die Apotheke am Samstag geöffnet?',a:['8:00–18:00 Uhr','9:00–13:00 Uhr','Sie ist geschlossen'],c:1},{t:'Nachricht',x:'Hallo Amir, ich komme heute etwas später. Der Bus hat Verspätung. Wir treffen uns um 17:30 Uhr vor dem Bahnhof. Bis gleich! Lena',q:'Wann treffen sich Amir und Lena?',a:['Um 17:00 Uhr','Um 17:30 Uhr','Morgen früh'],c:1},{t:'Anzeige',x:'Fahrrad zu verkaufen. Sehr guter Zustand, 80 Euro. Abholung in Hannover-Linden. Bitte nur ab 18 Uhr anrufen.',q:'Was kostet das Fahrrad?',a:['18 Euro','80 Euro','100 Euro'],c:1},{t:'E-Mail',x:'Liebe Frau Klein, Ihr Termin beim Zahnarzt ist am Dienstag, 12. Mai, um 10:15 Uhr. Bitte bringen Sie Ihre Versicherungskarte mit.',q:'Was soll Frau Klein mitbringen?',a:['Einen Ausweis','Geld','Die Versicherungskarte'],c:2},{t:'Öffnungszeiten',x:'Stadtbibliothek: Mo geschlossen · Di–Fr 10–19 Uhr · Sa 10–14 Uhr.',q:'Welche Aussage ist richtig?',a:['Montag ist die Bibliothek geschlossen.','Samstag ist bis 19 Uhr geöffnet.','Sonntag ist bis 14 Uhr geöffnet.'],c:0},{t:'Wohnungsanzeige',x:'2-Zimmer-Wohnung, 55 m², Küche und Balkon. Miete 620 € im Monat. Frei ab 1. Juli.',q:'Ab wann ist die Wohnung frei?',a:['Ab 1. Juni','Ab 1. Juli','Ab 620 Euro'],c:1},{t:'Hinweis',x:'Bitte nicht rauchen. Rauchen ist im gesamten Gebäude verboten.',q:'Was darf man hier nicht?',a:['Telefonieren','Essen','Rauchen'],c:2},{t:'Fahrplan',x:'Bus 126 Richtung Zentrum: Abfahrt 14:05 Uhr. Wegen einer Baustelle heute ca. 10 Minuten später.',q:'Wann fährt der Bus ungefähr?',a:['13:55 Uhr','14:05 Uhr','14:15 Uhr'],c:2}];let i=0,points=0,locked=false;const card=document.getElementById('card'),bar=document.getElementById('bar'),count=document.getElementById('count');function render(){locked=false;let o=tasks[i];bar.style.width=(i/tasks.length*100)+'%';count.textContent='Aufgabe '+(i+1)+' von '+tasks.length;card.innerHTML='<span class="tag">'+o.t+'</span><h2>'+o.q+'</h2><div class="text">'+o.x+'</div><div class="answers">'+o.a.map((v,n)=>'<button class="answer" data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('')+'</div><div id="fb" class="feedback"></div><button id="next" class="next">Weiter →</button>';card.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(+b.dataset.n));document.getElementById('next').onclick=next}function choose(n){if(locked)return;locked=true;let o=tasks[i],buttons=card.querySelectorAll('.answer');buttons[o.c].classList.add('ok');if(n===o.c){points++;document.getElementById('fb').textContent='✅ Richtig!'}else{buttons[n].classList.add('bad');document.getElementById('fb').textContent='❌ Nicht richtig. Die grüne Antwort ist richtig.'}document.getElementById('next').style.display='block'}function next(){i++;if(i<tasks.length)render();else finish()}function finish(){bar.style.width='100%';count.textContent='Training abgeschlossen';let pct=Math.round(points/tasks.length*100);card.innerHTML='<div class="result"><div style="font-size:3rem">🏅</div><h2>A1 Lesen abgeschlossen</h2><div class="score">'+points+' / '+tasks.length+'</div><p><b>'+pct+' % richtig</b></p><p class="small">Du hast kurze Nachrichten, Anzeigen, Schilder und Alltagstexte trainiert.</p><a class="restart" href="a1-lesen.html">Noch einmal üben</a></div>'}render();</script></body></html>
