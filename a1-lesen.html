<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 Lesen – Prüfungstraining</title><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:0 14px}.top{background:#fff;border-bottom:1px solid #e5ece8}.nav{min-height:58px;display:flex;align-items:center;gap:12px}.brand{font-weight:950;color:var(--ink);text-decoration:none}.back{margin-left:auto;color:var(--g);font-weight:900;text-decoration:none}.hero{background:linear-gradient(105deg,#066846,#159465);color:#fff;padding:28px 0}.hero h1{margin:0;font-size:2rem}.hero p{margin:7px 0 0;font-weight:700}.progress{height:8px;background:#dfe9e4;border-radius:20px;overflow:hidden;margin:18px 0 8px}.bar{height:100%;background:var(--g);width:0;transition:.3s}.count{text-align:right;color:#66766f;font-size:.82rem;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 5px 18px #0b56300c}.tag{display:inline-block;background:#e9f6ef;color:var(--g);padding:6px 10px;border-radius:20px;font-size:.75rem;font-weight:900}.card h2{font-size:1.3rem;margin:12px 0 8px}.text{background:#f6f9f7;border-left:4px solid var(--g);padding:15px;border-radius:10px;line-height:1.5;margin:12px 0 18px;white-space:pre-line}.answers{display:grid;gap:9px}.answer{width:100%;text-align:left;padding:13px 14px;border:2px solid #dfe8e4;border-radius:12px;background:#fff;font-size:.96rem;font-weight:750;color:var(--ink);cursor:pointer}.answer:hover{border-color:#8dcbb0}.answer.ok{border-color:#159465;background:#edf9f3}.answer.bad{border-color:#d45b5b;background:#fff2f2}.feedback{min-height:28px;margin:12px 0 4px;font-weight:900}.next{display:none;width:100%;border:0;border-radius:12px;padding:13px;background:var(--g);color:#fff;font-size:1rem;font-weight:900;cursor:pointer}.result{text-align:center}.score{font-size:3rem;font-weight:950;color:var(--g);margin:10px}.small{color:#66766f}.restart{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;background:var(--g);color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.hero{padding:22px 0}.hero h1{font-size:1.65rem}.card{padding:15px;border-radius:17px}.text{font-size:.94rem}.answer{font-size:.9rem;padding:12px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="telc-training.html">📖 A1 Training</a><a class="back" href="telc-training.html">← Übersicht</a></div></header><section class="hero"><div class="wrap"><h1>📖 A1 · Lesen</h1><p>24 abwechslungsreiche Aufgaben: Schilder, Nachrichten, Anzeigen, E-Mails, Fahrpläne und Alltagstexte.</p></div></section><main class="wrap"><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div><section id="card" class="card"></section></main><script>const tasks=[
{t:'Schild',x:'APOTHEKE – Montag bis Freitag 8:00–18:00 Uhr. Samstag 9:00–13:00 Uhr.',q:'Wann ist die Apotheke am Samstag geöffnet?',a:['8:00–18:00 Uhr','9:00–13:00 Uhr','Sie ist geschlossen'],c:1},
{t:'Nachricht',x:'Hallo Amir, ich komme heute etwas später. Der Bus hat Verspätung. Wir treffen uns um 17:30 Uhr vor dem Bahnhof. Bis gleich! Lena',q:'Wann treffen sich Amir und Lena?',a:['Um 17:00 Uhr','Um 17:30 Uhr','Morgen früh'],c:1},
{t:'Anzeige',x:'Fahrrad zu verkaufen. Sehr guter Zustand, 80 Euro. Abholung in Hannover-Linden. Bitte nur ab 18 Uhr anrufen.',q:'Was kostet das Fahrrad?',a:['18 Euro','80 Euro','100 Euro'],c:1},
{t:'E-Mail',x:'Liebe Frau Klein, Ihr Termin beim Zahnarzt ist am Dienstag, 12. Mai, um 10:15 Uhr. Bitte bringen Sie Ihre Versicherungskarte mit.',q:'Was soll Frau Klein mitbringen?',a:['Einen Ausweis','Geld','Die Versicherungskarte'],c:2},
{t:'Öffnungszeiten',x:'Stadtbibliothek: Mo geschlossen · Di–Fr 10–19 Uhr · Sa 10–14 Uhr.',q:'Welche Aussage ist richtig?',a:['Montag ist die Bibliothek geschlossen.','Samstag ist bis 19 Uhr geöffnet.','Sonntag ist bis 14 Uhr geöffnet.'],c:0},
{t:'Wohnungsanzeige',x:'2-Zimmer-Wohnung, 55 m², Küche und Balkon. Miete 620 € im Monat. Frei ab 1. Juli.',q:'Ab wann ist die Wohnung frei?',a:['Ab 1. Juni','Ab 1. Juli','Ab 620 Euro'],c:1},
{t:'Hinweis',x:'Bitte nicht rauchen. Rauchen ist im gesamten Gebäude verboten.',q:'Was darf man hier nicht?',a:['Telefonieren','Essen','Rauchen'],c:2},

{t:'Supermarkt',x:'Heute im Angebot: Äpfel 1,49 € pro Kilo. Das Angebot gilt nur am Freitag und Samstag.',q:'Wann kann man die Äpfel zum Angebotspreis kaufen?',a:['Montag und Dienstag','Freitag und Samstag','Nur Sonntag'],c:1},
{t:'Notiz',x:'Papa, ich bin bei Sara. Das Essen steht im Kühlschrank. Ich bin gegen 20 Uhr wieder zu Hause. Mia',q:'Wo ist das Essen?',a:['Bei Sara','Im Kühlschrank','Auf dem Tisch'],c:1},
{t:'Arztpraxis',x:'Praxis Dr. Weber: Wegen Urlaub vom 3. bis 10. August geschlossen. Ab 11. August sind wir wieder für Sie da.',q:'Wann öffnet die Praxis wieder?',a:['Am 3. August','Am 10. August','Am 11. August'],c:2},
{t:'Kleinanzeige',x:'Kinderbett, weiß, 70 × 140 cm, gebraucht, aber sauber. Preis: 40 €. Nur Selbstabholung.',q:'Wie bekommt man das Bett?',a:['Man muss es abholen.','Es wird kostenlos geliefert.','Es kommt mit der Post.'],c:0},
{t:'E-Mail',x:'Hallo Frau Berger, der Deutschkurs beginnt nicht am Montag, sondern am Mittwoch um 9 Uhr in Raum 12. Viele Grüße, Sprachschule Aktiv',q:'An welchem Tag beginnt der Kurs?',a:['Montag','Mittwoch','Freitag'],c:1},
{t:'Bahnhof',x:'RE 60 nach Braunschweig – Abfahrt 16:42 Uhr – Gleis 5. Heute fährt der Zug ausnahmsweise von Gleis 7.',q:'Von welchem Gleis fährt der Zug heute?',a:['Gleis 5','Gleis 7','Gleis 16'],c:1},
{t:'Restaurant',x:'Mittagstisch von 11:30 bis 14:30 Uhr: Suppe und Hauptgericht 12,90 €. Getränke sind nicht im Preis enthalten.',q:'Was ist nicht im Preis enthalten?',a:['Die Suppe','Das Hauptgericht','Die Getränke'],c:2},
{t:'Schule',x:'Liebe Eltern, am Freitag endet der Unterricht bereits um 11:30 Uhr. Bitte holen Sie die Kinder pünktlich ab.',q:'Was sollen die Eltern tun?',a:['Die Kinder um 11:30 Uhr abholen.','Die Kinder später zur Schule bringen.','Am Freitag zu Hause bleiben.'],c:0},
{t:'Paket',x:'Wir konnten Ihr Paket heute nicht zustellen. Sie können es ab morgen ab 10 Uhr in der Postfiliale Marktstraße 8 abholen.',q:'Ab wann kann man das Paket abholen?',a:['Heute um 10 Uhr','Morgen ab 10 Uhr','Morgen ab 8 Uhr'],c:1},
{t:'Fitnessstudio',x:'Probetraining kostenlos! Bitte Sportschuhe und ein Handtuch mitbringen. Anmeldung an der Rezeption.',q:'Was muss man zum Probetraining mitbringen?',a:['Sportschuhe und Handtuch','Essen und Getränke','Einen eigenen Trainer'],c:0},
{t:'Einladung',x:'Liebe Freunde, ich feiere meinen Geburtstag am Samstag ab 18 Uhr bei mir zu Hause. Bitte sagt mir bis Donnerstag Bescheid, ob ihr kommt. Anna',q:'Bis wann soll man Anna antworten?',a:['Bis Donnerstag','Bis Samstag','Bis Sonntag'],c:0},
{t:'Waschraum',x:'Waschmaschine 2 ist defekt. Bitte benutzen Sie bis zur Reparatur die Maschinen 1 oder 3.',q:'Welche Waschmaschine kann man nicht benutzen?',a:['Maschine 1','Maschine 2','Maschine 3'],c:1},
{t:'Hotel',x:'Frühstück: Montag–Freitag 6:30–10:00 Uhr, Samstag und Sonntag 7:30–11:00 Uhr.',q:'Wann beginnt das Frühstück am Sonntag?',a:['Um 6:30 Uhr','Um 7:30 Uhr','Um 11:00 Uhr'],c:1},
{t:'Nachricht',x:'Hallo Jonas, kannst du bitte auf dem Heimweg Milch und Brot kaufen? Eier haben wir noch genug. Danke! Mama',q:'Was soll Jonas kaufen?',a:['Milch und Brot','Eier und Milch','Nur Eier'],c:0},
{t:'Schwimmbad',x:'Wegen Reinigungsarbeiten bleibt das Schwimmbad am Dienstagvormittag geschlossen. Ab 14 Uhr ist wieder geöffnet.',q:'Wann kann man am Dienstag schwimmen?',a:['Um 10 Uhr','Um 12 Uhr','Ab 14 Uhr'],c:2},
{t:'Termin',x:'Herr Yilmaz, Ihr Beratungstermin ist am 22. September um 13:00 Uhr. Bitte kommen Sie 10 Minuten früher.',q:'Wann soll Herr Yilmaz da sein?',a:['Um 12:50 Uhr','Um 13:10 Uhr','Um 22:00 Uhr'],c:0}
];let i=0,points=0,locked=false;const card=document.getElementById('card'),bar=document.getElementById('bar'),count=document.getElementById('count');function render(){locked=false;let o=tasks[i];bar.style.width=(i/tasks.length*100)+'%';count.textContent='Aufgabe '+(i+1)+' von '+tasks.length;card.innerHTML='<span class="tag">'+o.t+'</span><h2>'+o.q+'</h2><div class="text">'+o.x+'</div><div class="answers">'+o.a.map((v,n)=>'<button class="answer" data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('')+'</div><div id="fb" class="feedback"></div><button id="next" class="next">Weiter →</button>';card.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(+b.dataset.n));document.getElementById('next').onclick=next}function choose(n){if(locked)return;locked=true;let o=tasks[i],buttons=card.querySelectorAll('.answer');buttons[o.c].classList.add('ok');if(n===o.c){points++;document.getElementById('fb').textContent='✅ Richtig!'}else{buttons[n].classList.add('bad');document.getElementById('fb').textContent='❌ Nicht richtig. Die grüne Antwort ist richtig.'}document.getElementById('next').style.display='block'}function next(){i++;if(i<tasks.length)render();else finish()}function finish(){bar.style.width='100%';count.textContent='Training abgeschlossen';let pct=Math.round(points/tasks.length*100);card.innerHTML='<div class="result"><div style="font-size:3rem">🏅</div><h2>A1 Lesen abgeschlossen</h2><div class="score">'+points+' / '+tasks.length+'</div><p><b>'+pct+' % richtig</b></p><p class="small">Du hast Schilder, Nachrichten, Anzeigen, E-Mails, Fahrpläne und Alltagstexte trainiert.</p><a class="restart" href="a1-lesen.html">Noch einmal üben</a></div>'}render();</script></body></html>
