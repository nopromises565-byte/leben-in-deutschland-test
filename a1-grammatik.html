<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 Wortschatz & Grammatik – Test in Deutschland</title><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2;--gold:#f4c64e}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:0 16px}.top{background:#fff;border-bottom:1px solid #e5ece8}.nav{min-height:58px;display:flex;align-items:center}.brand,.back{font-weight:900;text-decoration:none;color:var(--ink)}.back{margin-left:auto;color:var(--g)}.hero{background:linear-gradient(105deg,#066846,#159465);color:#fff;padding:24px 0}.hero h1{margin:0;font-size:1.9rem}.hero p{margin:6px 0 0;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center;font-size:.78rem;font-weight:800}.stat b{display:block;color:var(--g);font-size:1rem}.progress-head{display:flex;justify-content:space-between;font-weight:800;font-size:.82rem;margin-top:18px}.bar{height:7px;background:#e4ece8;border-radius:9px;overflow:hidden;margin:7px 0 12px}.fill{height:100%;background:var(--g);width:5%;transition:.25s}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 24px #0b56300c}.tag{display:inline-block;background:#e9f6ef;color:var(--g);border-radius:999px;padding:6px 9px;font-size:.72rem;font-weight:900}.card h2{font-size:1.25rem;margin:11px 0 5px}.question{font-size:1.05rem;font-weight:800;line-height:1.45;margin:13px 0}.answers{display:grid;gap:8px}.answer{width:100%;text-align:left;background:#fff;border:2px solid #dce7e2;border-radius:12px;padding:11px 12px;font-size:.95rem;font-weight:750;cursor:pointer;color:var(--ink)}.answer:hover{border-color:#8bbca7}.answer.good{background:#e8f7ef;border-color:#159465;color:#075c3d}.answer.bad{background:#fff0f0;border-color:#d9534f;color:#9b2825}.explain{display:none;margin-top:12px;padding:10px 12px;background:#fff8df;border-radius:11px;font-size:.86rem;line-height:1.4}.navbtns{display:flex;gap:8px;margin:12px 0 28px}.navbtns button{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.prev{background:#e7eeea;color:var(--ink)}.next{margin-left:auto;background:var(--g);color:#fff}.result{display:none;text-align:center}.result h2{font-size:1.55rem}.restart{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}@media(max-width:520px){.wrap{padding:0 12px}.hero{padding:19px 0}.hero h1{font-size:1.5rem}.hero p{font-size:.83rem}.stats{gap:6px}.stat{padding:8px 4px;font-size:.67rem}.card{padding:14px;border-radius:15px}.question{font-size:.98rem}.answer{padding:10px;font-size:.88rem}.brand,.back{font-size:.86rem}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Test in Deutschland</a><a class="back" href="telc-training.html">← A1 Training</a></div></header><section class="hero"><div class="wrap"><h1>🧠 A1 Wortschatz & Grammatik</h1><p>Kurze Übungen für wichtige Wörter und einfache Grammatik.</p></div></section><main class="wrap"><div class="stats"><div class="stat"><b>20</b>Aufgaben</div><div class="stat"><b>10</b>Themen</div><div class="stat"><b>✓</b>Sofort prüfen</div></div><div class="progress-head"><span id="count">Aufgabe 1 von 20</span><span id="score">0 richtig</span></div><div class="bar"><div class="fill" id="fill"></div></div><section class="card" id="quiz"><span class="tag" id="tag"></span><h2 id="title"></h2><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="explain" id="explain"></div></section><section class="card result" id="result"><h2>🎉 Training geschafft!</h2><p id="resultText"></p><button class="restart" onclick="restart()">Noch einmal üben</button></section><div class="navbtns" id="navbtns"><button class="prev" id="prev" onclick="move(-1)">← Zurück</button><button class="next" id="next" onclick="move(1)">Weiter →</button></div></main><script>const tasks=[
['Artikel','der · die · das','___ Tisch ist groß.',['Der','Die','Das'],0,'„Tisch“ ist männlich: der Tisch.'],
['Artikel','der · die · das','___ Wohnung ist klein.',['Der','Die','Das'],1,'„Wohnung“ ist weiblich: die Wohnung.'],
['Artikel','der · die · das','___ Kind spielt.',['Der','Die','Das'],2,'„Kind“ ist sächlich: das Kind.'],
['Verben','Präsens','Ich ___ in Hannover.',['wohne','wohnst','wohnt'],0,'Bei „ich“ heißt es: ich wohne.'],
['Verben','Präsens','Du ___ Deutsch.',['lerne','lernst','lernen'],1,'Bei „du“ bekommt das Verb meist die Endung -st.'],
['Verben','sein','Wir ___ müde.',['bin','seid','sind'],2,'Richtig ist: wir sind.'],
['Pronomen','Personalpronomen','Anna kommt aus Berlin. ___ ist 25 Jahre alt.',['Er','Sie','Es'],1,'Für Anna verwenden wir „sie“.'],
['Fragen','W-Fragen','___ wohnst du? – In Garbsen.',['Wo','Wer','Was'],0,'Mit „Wo?“ fragt man nach einem Ort.'],
['Fragen','W-Fragen','___ heißt du? – Ich heiße Amir.',['Wie','Wann','Wo'],0,'Nach dem Namen fragt man: Wie heißt du?'],
['Negation','nicht / kein','Ich habe ___ Auto.',['nicht','kein','keine'],1,'Vor „Auto“ benutzt man hier „kein“.'],
['Negation','nicht / kein','Das ist ___ teuer.',['nicht','kein','keinen'],0,'Ein Adjektiv wird hier mit „nicht“ verneint.'],
['Akkusativ','Artikel','Ich kaufe ___ Apfel.',['ein','einen','eine'],1,'Maskulin im Akkusativ: einen Apfel.'],
['Modalverben','können','Ich ___ gut schwimmen.',['kann','kannst','können'],0,'Richtig ist: ich kann.'],
['Modalverben','müssen','Wir ___ heute arbeiten.',['muss','müsst','müssen'],2,'Richtig ist: wir müssen.'],
['Satzbau','Wortstellung','Welcher Satz ist richtig?',['Ich heute arbeite.','Ich arbeite heute.','Arbeite ich heute jeden Tag.'],1,'Im Aussagesatz steht das konjugierte Verb meist an Position 2.'],
['Uhrzeit','Zeit','07:30 Uhr heißt:',['halb sieben','halb acht','acht Uhr dreißig'],1,'07:30 Uhr = halb acht.'],
['Alltag','Einkaufen','Wo kauft man Brot?',['In der Bäckerei','In der Apotheke','Bei der Bank'],0,'Brot kauft man normalerweise in der Bäckerei.'],
['Alltag','Gesundheit','Du bist krank. Wohin gehst du?',['Zum Arzt','Zum Bahnhof','Zur Post'],0,'Wenn man krank ist, geht man zum Arzt.'],
['Wortschatz','Verkehr','Ein Bus und eine Bahn sind ...',['Lebensmittel','Verkehrsmittel','Möbel'],1,'Bus und Bahn sind Verkehrsmittel.'],
['Wortschatz','Familie','Der Sohn meiner Eltern ist mein ...',['Bruder','Onkel','Vater'],0,'Ein weiterer Sohn deiner Eltern ist dein Bruder.']
];let i=0,correct=0,done=Array(tasks.length).fill(false);function render(){if(i>=tasks.length){finish();return}const t=tasks[i];document.getElementById('quiz').style.display='block';document.getElementById('result').style.display='none';document.getElementById('navbtns').style.display='flex';tag.textContent=t[0]+' · A1';title.textContent=t[1];question.textContent=t[2];count.textContent=`Aufgabe ${i+1} von ${tasks.length}`;score.textContent=`${correct} richtig`;fill.style.width=((i+1)/tasks.length*100)+'%';answers.innerHTML='';explain.style.display='none';t[3].forEach((a,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>choose(n,b);answers.appendChild(b)});prev.disabled=i===0;next.textContent=i===tasks.length-1?'Ergebnis →':'Weiter →'}function choose(n,b){if(done[i])return;done[i]=true;const t=tasks[i],bs=[...answers.children];if(n===t[4]){b.classList.add('good');correct++}else{b.classList.add('bad');bs[t[4]].classList.add('good')}bs.forEach(x=>x.disabled=true);explain.textContent=t[5];explain.style.display='block';score.textContent=`${correct} richtig`}function move(d){i+=d;if(i<0)i=0;if(i>=tasks.length){finish();return}render()}function finish(){quiz.style.display='none';navbtns.style.display='none';result.style.display='block';count.textContent='Fertig';fill.style.width='100%';score.textContent=`${correct} richtig`;const p=Math.round(correct/tasks.length*100);resultText.textContent=`Du hast ${correct} von ${tasks.length} Aufgaben richtig beantwortet (${p} %).`}function restart(){i=0;correct=0;done=Array(tasks.length).fill(false);render()}render();</script></body></html>
