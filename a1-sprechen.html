<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 Sprechen – Test in Deutschland</title><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font-family:Arial,sans-serif}.top{background:#fff;border-bottom:1px solid #e5ece8}.wrap{max-width:820px;margin:auto;padding:0 16px}.nav{min-height:52px;display:flex;align-items:center}.brand,.back{font-weight:900;color:var(--ink);text-decoration:none;font-size:.92rem}.back{margin-left:auto;color:var(--g)}.hero{background:linear-gradient(105deg,#066846,#159465);color:#fff;padding:20px 0}.hero h1{margin:0;font-size:1.7rem}.hero p{margin:5px 0 0;font-weight:650}.intro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.intro div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-weight:800;font-size:.78rem}.progress{margin:12px 0 8px;font-weight:900}.bar{height:7px;background:#dce9e3;border-radius:20px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--g)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin:11px 0}.card h2{margin:12px 0;font-size:1.45rem}.tag{display:inline-block;background:#e9f7f0;color:var(--g);font-weight:900;border-radius:999px;padding:5px 9px;font-size:.72rem}.task{background:#f3f8f5;border-left:3px solid var(--g);padding:11px 12px;border-radius:10px;line-height:1.4}.prompt{margin:10px 0;background:#fff9e9;border:1px solid #f0d98e;border-radius:11px;padding:11px 12px;line-height:1.4}.rec{margin-top:11px;padding:11px;border:1px solid #d9e9e1;border-radius:13px;background:#f8fcfa}.rec h3{margin:0 0 4px}.rec p{color:#53645d}.btn,.hold,.permit{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer;background:var(--g);color:#fff}.hold,.permit{width:100%;min-height:48px;font-size:.9rem}.hold.recording{background:#b3261e}.hold:disabled{background:#aebbb5;cursor:not-allowed}.permit{background:#0b6fd3;margin-bottom:8px}.status{font-weight:750;margin-top:7px;color:#607069}.status.ok{color:#08784f}.status.bad{color:#b3261e}.audio{width:100%;height:38px;margin-top:8px}.actions{display:flex;gap:7px;margin-top:10px}.btn.alt{background:#fff;color:var(--g);border:1.5px solid var(--g)}.example{display:none;margin-top:10px;background:#eaf7f1;border:1px solid #cde8da;border-radius:11px;padding:10px}.example.show{display:block}.done{display:none;margin-top:8px;color:#075d3f;font-weight:900}.done.show{display:block}.navtasks{display:flex;justify-content:space-between;margin:10px 0 24px}.result{text-align:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin:12px 0 25px}@media(max-width:600px){.wrap{padding:0 10px}.nav{min-height:48px}.brand,.back{font-size:.78rem}.hero{padding:15px 0}.hero h1{font-size:1.45rem}.intro{gap:6px}.intro div{font-size:.68rem}.card{padding:13px}.card h2{font-size:1.25rem}.task,.prompt{font-size:.86rem}.actions{display:grid;grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Test in Deutschland</a><a class="back" href="telc-training.html">← A1 Training</a></div></header><section class="hero"><div class="wrap"><h1>🗣️ A1 Sprechen</h1><p>Mikrofon erlauben, gedrückt halten, sprechen und loslassen.</p></div></section><main class="wrap"><div class="intro"><div><b>20</b> Aufgaben</div><div><b>🎤</b> Mikrofon</div><div><b>▶</b> Anhören</div></div><div class="progress"><span id="progressText"></span><div class="bar"><i id="bar"></i></div></div><section class="card" id="card"></section><div class="navtasks"><button class="btn alt" id="prev">← Zurück</button><button class="btn" id="next">Weiter →</button></div><section class="result" id="result" hidden><h2>Training geschafft 🎉</h2><p>Du hast alle Sprechaufgaben durchgearbeitet.</p><strong id="doneCount"></strong><br><br><button class="btn" onclick="restart()">Nochmal üben</button></section></main><script>const tasks=[['Vorstellen','Stell dich vor','Du lernst eine neue Person im Deutschkurs kennen.','Stell dich kurz vor: Name, Herkunft, Wohnort und Sprachen.','Sprich in kurzen, ganzen Sätzen.','Hallo, ich heiße Samir. Ich komme aus Syrien. Ich wohne in Hannover und spreche Arabisch und ein bisschen Deutsch.'],['Vorstellen','Familie','Jemand fragt dich nach deiner Familie.','Erzähle kurz von deiner Familie.','Benutze: Ich habe … / Meine Familie …','Ich habe einen Bruder und eine Schwester. Meine Eltern wohnen in Berlin.'],['Vorstellen','Arbeit und Beruf','Im Kurs sprecht ihr über Berufe.','Was machst du beruflich?','Du kannst auch über Ausbildung oder Arbeitssuche sprechen.','Ich mache eine Ausbildung als Maurer. Ich arbeite in einer Baufirma.'],['Vorstellen','Freizeit','Eine neue Person fragt nach deinen Hobbys.','Was machst du gern in deiner Freizeit?','Nenne mindestens zwei Aktivitäten.','Ich gehe gern spazieren und spiele Fußball.'],['Fragen & Antworten','Wohnen','Du sprichst mit einem Partner über Wohnen.','Stelle eine Frage mit dem Wort Wohnung und antworte selbst.','Frage nach Größe, Zimmern oder Ort.','Wie groß ist deine Wohnung? – Meine Wohnung hat drei Zimmer.'],['Fragen & Antworten','Essen','Ihr sprecht über Essen und Trinken.','Stelle eine Frage zum Essen und antworte selbst.','Nutze Was, Wann oder Wo.','Was isst du gern? – Ich esse gern Reis und Gemüse.'],['Fragen & Antworten','Wochenende','Ihr sprecht über das Wochenende.','Frage nach Plänen und antworte selbst.','Nutze: Was machst du …?','Was machst du am Wochenende? – Am Samstag besuche ich meine Familie.'],['Fragen & Antworten','Einkaufen','Ihr sprecht über Einkaufen.','Stelle eine Frage über Supermarkt, Kleidung oder Preise.','Achte auf die Frageform.','Wo kaufst du Lebensmittel? – Ich kaufe im Supermarkt ein.'],['Fragen & Antworten','Verkehr','Ihr sprecht über Bus und Bahn.','Frage, wie dein Partner zum Kurs kommt.','Nutze: Wie kommst du …?','Wie kommst du zum Deutschkurs? – Ich fahre mit dem Bus.'],['Fragen & Antworten','Uhrzeit','Du möchtest wissen, wann der Kurs beginnt.','Frage nach der Uhrzeit und antworte.','Nutze Wann oder Um wie viel Uhr.','Um wie viel Uhr beginnt der Kurs? – Um 9 Uhr.'],['Bitten & Reagieren','Ein Glas Wasser','Du bist bei einem Freund und möchtest Wasser.','Bitte höflich um ein Glas Wasser.','Benutze bitte oder Kann ich …?','Kann ich bitte ein Glas Wasser haben? – Ja, natürlich.'],['Bitten & Reagieren','Fenster öffnen','Im Raum ist es sehr warm.','Bitte eine Person, das Fenster zu öffnen.','Nutze: Kannst du bitte …?','Kannst du bitte das Fenster öffnen? – Ja, gern.'],['Bitten & Reagieren','Stift ausleihen','Im Kurs hast du keinen Stift.','Bitte deinen Nachbarn um einen Stift.','Formuliere eine kurze höfliche Bitte.','Entschuldigung, kann ich bitte einen Stift haben?'],['Bitten & Reagieren','Hilfe mit Tasche','Deine Tasche ist sehr schwer.','Bitte eine Person um Hilfe.','Nutze: Können Sie mir bitte …?','Können Sie mir bitte mit der Tasche helfen?'],['Bitten & Reagieren','Handy benutzen','Dein Handy funktioniert nicht.','Frage höflich, ob du ein Handy benutzen darfst.','Nutze: Darf ich …?','Entschuldigung, darf ich kurz Ihr Handy benutzen?'],['Alltag','Beim Bäcker','Du möchtest zwei Brötchen und ein Brot kaufen.','Bestelle und frage nach dem Preis.','Begrüßung, Bestellung, Preisfrage.','Guten Morgen. Ich hätte gern zwei Brötchen und ein Brot. Wie viel kostet das?'],['Alltag','Arzttermin','Du möchtest telefonisch einen Arzttermin.','Frage nach einem Termin am Montag.','Sprich höflich und kurz.','Guten Tag. Ich möchte gern einen Termin. Haben Sie am Montag etwas frei?'],['Alltag','Nach dem Weg fragen','Du suchst den Bahnhof.','Frage höflich nach dem Weg zum Bahnhof.','Beginne mit Entschuldigung.','Entschuldigung, wie komme ich zum Bahnhof?'],['Alltag','Im Restaurant','Du möchtest Suppe und Wasser.','Bestelle und bitte später um die Rechnung.','Übe Bestellung und Abschluss.','Ich möchte bitte eine Suppe und ein Wasser. Die Rechnung bitte.'],['Alltag','Einladung','Du möchtest einen Freund am Samstag einladen.','Lade ihn ein, nenne eine Uhrzeit und frage, ob er kommen kann.','Nenne Tag und Uhrzeit deutlich.','Hast du am Samstag Zeit? Kommst du um 16 Uhr zu mir?']];let index=0,mediaRecorder=null,stream=null,chunks=[],audioUrl=null,micAllowed=false;const completed=new Set(),card=document.getElementById('card');async function requestMic(){const status=document.getElementById('recStatus'),p=document.getElementById('permit'),h=document.getElementById('holdRec');if(!navigator.mediaDevices?.getUserMedia){status.textContent='Mikrofon wird von diesem Browser nicht unterstützt.';status.className='status bad';return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());micAllowed=true;p.hidden=true;h.disabled=false;status.textContent='✓ Mikrofon erlaubt. Jetzt den grünen Knopf gedrückt halten.';status.className='status ok'}catch(e){micAllowed=false;status.textContent='Mikrofon wurde nicht erlaubt. Tippe oben auf das Schloss/Seiten-Symbol und erlaube Mikrofon.';status.className='status bad'}}function render(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const t=tasks[index];document.getElementById('progressText').textContent=`Aufgabe ${index+1} von ${tasks.length}`;document.getElementById('bar').style.width=((index+1)/tasks.length*100)+'%';card.innerHTML=`<span class="tag">${t[0]} · A1</span><h2>${t[1]}</h2><div class="task">${t[2]}</div><div class="prompt"><strong>🎤 Deine Aufgabe:</strong><br>${t[3]}</div><p><b>Hilfe:</b> ${t[4]}</p><div class="rec"><h3>🎙️ Antwort aufnehmen</h3><p>Beim ersten Mal bitte zuerst Mikrofon freigeben.</p><button class="permit" id="permit" ${micAllowed?'hidden':''}>🎤 Mikrofon erlauben</button><button class="hold" id="holdRec" ${micAllowed?'':'disabled'}>🎤 Gedrückt halten</button><div class="status ${micAllowed?'ok':''}" id="recStatus">${micAllowed?'✓ Mikrofon ist erlaubt.':'Tippe auf „Mikrofon erlauben“. Google Chrome fragt dich dann nach der Berechtigung.'}</div><div id="player"></div></div><div class="actions"><button class="btn" onclick="done()">✓ Geübt</button><button class="btn alt" onclick="example()">Beispiel anzeigen</button></div><div class="done ${completed.has(index)?'show':''}" id="done">✓ Aufgabe geübt</div><div class="example" id="example"><b>Beispiel:</b><br>${t[5]}</div>`;document.getElementById('permit').onclick=requestMic;bindHold();document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===tasks.length-1?'Ergebnis →':'Weiter →'}function bindHold(){const b=document.getElementById('holdRec');b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);startRecording()});b.addEventListener('pointerup',e=>{e.preventDefault();stopRecording()});b.addEventListener('pointercancel',stopRecording);b.addEventListener('contextmenu',e=>e.preventDefault())}async function startRecording(){if(!micAllowed)return;const status=document.getElementById('recStatus'),b=document.getElementById('holdRec');try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});audioUrl=URL.createObjectURL(blob);document.getElementById('player').innerHTML=`<audio class="audio" controls src="${audioUrl}"></audio>`;status.textContent='✓ Aufnahme fertig – jetzt anhören.';status.className='status ok';b.classList.remove('recording');b.textContent='🎤 Gedrückt halten';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};mediaRecorder.start();b.classList.add('recording');b.textContent='🔴 Sprich jetzt – loslassen';status.textContent='● Aufnahme läuft …';status.className='status bad'}catch(e){status.textContent='Mikrofon konnte nicht gestartet werden.';status.className='status bad'}}function stopRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop()}function done(){completed.add(index);document.getElementById('done').classList.add('show')}function example(){document.getElementById('example').classList.toggle('show')}document.getElementById('prev').onclick=()=>{if(index>0){index--;render();scrollTo(0,100)}};document.getElementById('next').onclick=()=>{if(index<tasks.length-1){index++;render();scrollTo(0,100)}else{card.hidden=true;document.querySelector('.navtasks').hidden=true;document.getElementById('result').hidden=false;document.getElementById('doneCount').textContent=`${completed.size}/${tasks.length}`}};function restart(){index=0;completed.clear();card.hidden=false;document.querySelector('.navtasks').hidden=false;document.getElementById('result').hidden=true;render();scrollTo(0,0)}render();</script></body></html>
