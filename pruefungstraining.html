<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüfungstraining A2/B1 – Test in Deutschland</title><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2;--bg:#f7faf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:800px;margin:auto;padding:0 14px}.top{background:#fff;border-bottom:1px solid var(--line)}.nav{height:56px;display:flex;align-items:center}.brand,.back{text-decoration:none;font-weight:900;color:var(--ink)}.back{margin-left:auto;color:var(--g)}.hero{background:linear-gradient(105deg,#066846,#159465);color:#fff;padding:22px 0}.hero h1{margin:0;font-size:1.8rem}.hero p{margin:6px 0 0;font-weight:700}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.menu a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 5px;text-align:center;text-decoration:none;color:var(--ink);font-weight:900;font-size:.8rem}.menu a.on{background:var(--g);color:#fff}.status{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:12px 0}.bar{height:7px;background:#e2ebe7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 18px #0b56300a}.tag{display:inline-block;background:#e8f5ee;color:var(--g);padding:5px 9px;border-radius:999px;font-size:.72rem;font-weight:900}.card h2{font-size:1.2rem;margin:10px 0}.text,.prompt{background:#f3f7f5;border-radius:12px;padding:12px;line-height:1.5;margin:10px 0}.prompt{background:#fff7df}.answers{display:grid;gap:8px}.answer{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;text-align:left;font-weight:800}.answer.sel{border:2px solid var(--g);background:#edf8f2}.controls{display:flex;gap:8px;margin:12px 0 28px}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--g);color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.btn.alt{background:#fff;color:var(--g);border:2px solid var(--g);padding:9px 12px}.write textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit}.note{font-size:.76rem;color:#66766f;line-height:1.45}.result{text-align:center}.score{font-size:2.4rem;font-weight:950;color:var(--g)}.mic{width:100%;padding:15px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:900;font-size:1rem;touch-action:none}.mic.rec{background:#b42318}.hidden{display:none!important}@media(max-width:560px){.menu{grid-template-columns:repeat(3,1fr);gap:6px}.menu a{font-size:.7rem;padding:8px 3px}.hero h1{font-size:1.45rem}.card{padding:14px}.brand,.back{font-size:.82rem}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Test in Deutschland</a><a class="back" href="telc-training.html">← Training</a></div></header><section class="hero"><div class="wrap"><h1 id="title"></h1><p id="sub"></p></div></section><main class="wrap"><nav class="menu" id="menu"></nav><div class="status"><div><b id="step"></b><div class="bar"><i id="progress"></i></div></div><b id="timer"></b></div><section class="card" id="task"></section><div class="controls"><button class="btn alt" id="prev">← Zurück</button><button class="btn" id="next">Weiter →</button></div><section id="result" class="card result hidden"></section></main><script>
const P=new URLSearchParams(location.search),L=(P.get('level')||'A2').toUpperCase(),S=P.get('skill')||'lesen';const names={lesen:'📖 Lesen',hoeren:'🎧 Hören',schreiben:'✍️ Schreiben',sprechen:'🗣️ Sprechen',grammatik:'🧠 Wortschatz & Grammatik',pruefung:'🎓 Prüfungssimulation'};const pools={A2:{lesen:[['Aushang','Wegen Renovierung bleibt die Bibliothek am Mittwoch geschlossen. Ab Donnerstag sind wir wieder wie gewohnt für Sie da.','Wann kann man wieder in die Bibliothek?',['Mittwoch','Donnerstag','Freitag'],1],['E-Mail','Hallo Samir, mein Zug hat Verspätung. Ich komme ungefähr 20 Minuten später zum Treffen. Warte bitte im Café gegenüber vom Bahnhof.','Wo soll Samir warten?',['Am Gleis','Im Café','Zu Hause'],1],['Anzeige','Fahrrad zu verkaufen: drei Jahre alt, sehr guter Zustand, 120 Euro. Nur Abholung.','Was stimmt?',['Das Fahrrad wird geliefert.','Es kostet 120 Euro.','Es ist neu.'],1],['Praxis','Unsere Praxis ist montags bis donnerstags von 8 bis 17 Uhr geöffnet, freitags nur bis 13 Uhr.','Wann schließt die Praxis am Freitag?',['13 Uhr','15 Uhr','17 Uhr'],0],['Wohnung','2-Zimmer-Wohnung, 55 m², Balkon, 650 Euro warm. Haustiere nach Absprache.','Was hat die Wohnung?',['Garage','Balkon','Garten'],1]],hoeren:[['Ansage','Der Bus Linie 5 fährt heute wegen einer Baustelle nicht über den Marktplatz. Bitte benutzen Sie die Haltestelle Rathaus.','Welche Haltestelle soll man benutzen?',['Marktplatz','Rathaus','Bahnhof'],1],['Telefon','Guten Tag, hier ist die Zahnarztpraxis. Ihr Termin morgen um zehn Uhr muss leider auf elf Uhr verschoben werden.','Wann ist der neue Termin?',['10 Uhr','11 Uhr','12 Uhr'],1],['Gespräch','Ich wollte heute einkaufen, aber der Supermarkt ist schon zu. Dann gehe ich morgen früh.','Wann geht die Person einkaufen?',['Heute Abend','Morgen früh','Morgen Abend'],1],['Wetter','Am Vormittag bleibt es trocken. Gegen Nachmittag beginnt es zu regnen.','Wann regnet es?',['Morgens','Nachmittags','Gar nicht'],1]],grammatik:[['Perfekt','Welcher Satz ist richtig?','',['Ich habe gestern gearbeitet.','Ich bin gestern gearbeitet.','Ich habe gestern arbeiten.'],0],['weil','Ergänze richtig: Ich bleibe zu Hause, weil ...','',['ich bin krank.','ich krank bin.','bin ich krank.'],1],['Dativ','Ich fahre mit ___ Bus.','',['der','dem','den'],1],['Komparativ','Mein neues Zimmer ist ___ als das alte.','',['groß','größer','am größten'],1],['Modalverb','Du ___ hier nicht rauchen.','',['darfst','dürfen','darf'],0],['Präposition','Ich warte ___ den Bus.','',['auf','mit','bei'],0],['Reflexiv','Ich interessiere ___ für Musik.','',['mich','mir','dich'],0],['Nebensatz','Wenn ich Zeit habe, ___ ich dich.','',['besuche','ich besuche','besuchst'],0]],schreiben:[['Nachricht an einen Freund','Du kannst heute nicht zum Treffen kommen. Schreibe: Warum? Neuer Termin? Entschuldigung.'],['E-Mail an Sprachschule','Du möchtest einen A2-Kurs besuchen. Frage nach Beginn, Unterrichtszeiten und Preis.'],['Reklamation','Du hast eine Lampe gekauft. Sie funktioniert nicht. Schreibe an das Geschäft: Problem, Kaufdatum, gewünschte Lösung.'],['Einladung','Lade eine Freundin zu deiner Geburtstagsfeier ein. Schreibe: Datum, Uhrzeit, Ort und was sie mitbringen kann.']],sprechen:[['Sich vorstellen','Sprich über Wohnort, Familie, Arbeit, Sprachen und Freizeit.'],['Über Alltag sprechen','Beschreibe deinen normalen Tagesablauf.'],['Etwas planen','Plane mit einem Partner einen gemeinsamen Ausflug: Tag, Uhrzeit, Verkehrsmittel, Essen.'],['Um Hilfe bitten','Du hast ein Problem mit einem Fahrkartenautomaten. Bitte höflich um Hilfe.'],['Meinung äußern','Was findest du besser: Auto oder öffentliche Verkehrsmittel? Begründe kurz.']]},B1:{lesen:[['Artikel','Immer mehr Beschäftigte arbeiten teilweise von zu Hause. Viele schätzen die gesparte Fahrzeit. Gleichzeitig fehlt manchen der direkte Kontakt zu Kolleginnen und Kollegen.','Welcher Nachteil wird genannt?',['Höhere Fahrkosten','Weniger direkter Kontakt','Mehr Arbeitswege'],1],['Mitteilung','Aufgrund technischer Arbeiten bleibt das Bürgerbüro am Freitag geschlossen. Bereits vereinbarte Termine werden automatisch auf die folgende Woche verschoben.','Was passiert mit Terminen?',['Sie entfallen endgültig.','Sie werden verschoben.','Man muss neu bezahlen.'],1],['Leserbrief','Ich finde, Innenstädte sollten mehr Platz für Fahrräder bieten. Dadurch könnten Lärm und Abgase reduziert werden. Allerdings braucht es auch gute Lösungen für Lieferverkehr.','Was ist die Meinung?',['Weniger Radwege','Mehr Platz für Fahrräder','Lieferverkehr verbieten'],1],['Kursinfo','Der Kurs richtet sich an Berufstätige und findet zweimal wöchentlich abends statt. Vorkenntnisse auf A2-Niveau werden vorausgesetzt.','Für wen ist der Kurs besonders geeignet?',['Berufstätige','Kinder','Anfänger ohne Vorkenntnisse'],0],['Vertrag','Die Kündigungsfrist beträgt drei Monate zum Monatsende. Die Kündigung muss schriftlich erfolgen.','Wie muss gekündigt werden?',['Telefonisch','Schriftlich','Persönlich ohne Schreiben'],1]],hoeren:[['Radio','Die Stadt plant, im kommenden Jahr zusätzliche Buslinien einzusetzen. Damit sollen besonders die Außenbezirke besser angebunden werden.','Was ist geplant?',['Weniger Busse','Neue Buslinien','Höhere Parkgebühren'],1],['Gespräch','Ich würde gern an der Weiterbildung teilnehmen. Allerdings überschneidet sich der erste Termin mit meiner Arbeit. Ich frage, ob ich später einsteigen kann.','Was ist das Problem?',['Der Preis','Der erste Termin','Der Kursort'],1],['Nachricht','Wegen eines technischen Defekts verzögert sich die Abfahrt des Zuges voraussichtlich um etwa 25 Minuten.','Warum gibt es Verspätung?',['Wetter','Technischer Defekt','Streik'],1],['Interview','Für mich war der Umzug zuerst schwierig. Inzwischen kenne ich meine Nachbarn und fühle mich im neuen Viertel sehr wohl.','Wie fühlt sich die Person jetzt?',['Wohl','Unsicher','Ärgerlich'],0]],grammatik:[['Konnektor','Ich gehe zu Fuß, ___ das Wetter schlecht ist.','',['obwohl','deshalb','damit'],0],['Relativsatz','Das ist der Kollege, ___ mir geholfen hat.','',['der','den','dem'],0],['Konjunktiv II','An deiner Stelle ___ ich früher anfangen.','',['würde','werde','wurde'],0],['Passiv','Die Straße ___ morgen gesperrt.','',['wird','hat','ist worden'],0],['Infinitiv mit zu','Ich versuche, jeden Tag Deutsch ___.','',['zu lernen','lernen zu','gelernt'],0],['Genitiv/Dativ','Trotz ___ Wetters gehen wir spazieren.','',['des schlechten','dem schlechten','den schlechten'],0],['Präteritum','Früher ___ ich jeden Tag mit dem Bus.','',['fuhr','fahre','gefahren'],0],['zweiteiliger Konnektor','___ mehr ich übe, desto sicherer werde ich.','',['Je','Wenn','Obwohl'],0]],schreiben:[['Formelle Anfrage','Du interessierst dich für eine berufliche Weiterbildung. Frage nach Voraussetzungen, Terminen, Kosten und Abschluss.'],['Beschwerde','Du hast ein Hotelzimmer gebucht, aber mehrere Leistungen fehlten. Beschreibe die Probleme und fordere eine angemessene Lösung.'],['Meinungsbeitrag','Sollten Innenstädte autofreier werden? Schreibe deine Meinung mit mindestens zwei Gründen und einem Gegenargument.'],['E-Mail an Vermieter','In deiner Wohnung funktioniert die Heizung nicht richtig. Beschreibe seit wann das Problem besteht, welche Folgen es hat und bitte um einen Termin.']],sprechen:[['Kurzpräsentation','Sprich über das Thema „Lernen im Internet“. Nenne eigene Erfahrungen, Vor- und Nachteile und deine Meinung.'],['Gemeinsam planen','Plane mit einem Partner ein Fest für euren Deutschkurs: Ort, Termin, Essen, Musik und Aufgabenverteilung.'],['Diskussion','Sollten Geschäfte sonntags geöffnet sein? Äußere deine Meinung, reagiere auf Gegenargumente und begründe.'],['Erfahrung beschreiben','Berichte über eine wichtige Veränderung in deinem Leben und erkläre, was du daraus gelernt hast.'],['Problem lösen','Ein gemeinsamer Termin fällt aus. Schlage Alternativen vor und findet eine Lösung.']]}};
function repeat(a,n){return Array.from({length:n},(_,i)=>a[i%a.length])}function make(){let p=pools[L],a;if(S==='lesen'||S==='hoeren'||S==='grammatik')a=repeat(p[S],20);else if(S==='schreiben'||S==='sprechen')a=repeat(p[S],20);else{let closed=[...repeat(p.lesen,6).map(x=>['Lesen',...x]),...repeat(p.hoeren,6).map(x=>['Hören',...x]),...repeat(p.grammatik,8).map(x=>['Grammatik',...x])];let open=[...p.schreiben.slice(0,1).map(x=>['Schreiben',...x]),...p.sprechen.slice(0,2).map(x=>['Sprechen',...x])];a=[...closed,...open]}return a}let tasks=make(),i=0,ans={},left=S==='pruefung'?(L==='B1'?5400:3600):0,recorder,stream,chunks=[];title.textContent=`${names[S]} · ${L}`;sub.textContent=S==='pruefung'?`Komplette ${L}-Simulation mit Lesen, Hören, Sprachbausteinen, Schreiben und Sprechen`:`20 interaktive ${L}-Aufgaben · selbst erstellt · prüfungsorientiert`;menu.innerHTML=Object.entries(names).map(([k,v])=>`<a class="${k===S?'on':''}" href="?level=${L}&skill=${k}">${v}</a>`).join('');function render(){let q=tasks[i],type=S;if(S==='pruefung')type=q[0].toLowerCase(),q=q.slice(1);let h=`<span class="tag">${names[type]||type} · ${L}</span>`;if(type==='lesen'){h+=`<h2>${q[0]}</h2><div class="text">${q[1]}</div><div class="prompt">${q[2]}</div>`+choices(q[3])}else if(type==='hoeren'){h+=`<h2>Hörverstehen</h2><div class="prompt">${q[2]}</div><button class="btn" onclick="hear('${esc(q[1])}')">🔊 Anhören</button>`+choices(q[3])}else if(type==='grammatik'){h+=`<h2>${q[0]}</h2><div class="prompt">${q[1]}</div>`+choices(q[3])}else if(type==='schreiben'){h+=`<h2>${q[0]}</h2><div class="prompt">${q[1]}</div><div class="write"><textarea id="txt" placeholder="Hier schreiben …">${ans[i]||''}</textarea></div><p class="note">Achte auf alle Leitpunkte, verständliche Sätze, passende Anrede und Grußformel.</p>`}else{h+=`<h2>${q[0]}</h2><div class="prompt">${q[1]}</div><button id="mic" class="mic">🎤 Gedrückt halten und sprechen</button><div id="audio"></div><p class="note">Taste halten → sprechen → loslassen. Deine Aufnahme bleibt nur im Browser.</p>`}task.innerHTML=h;if(type==='sprechen')bindMic();step.textContent=`Aufgabe ${i+1} von ${tasks.length}`;progress.style.width=((i+1)/tasks.length*100)+'%';prev.disabled=i===0;next.textContent=i===tasks.length-1?'Abgeben ✓':'Weiter →'}function choices(a){return `<div class="answers">${a.map((x,n)=>`<button class="answer ${ans[i]===n?'sel':''}" onclick="pick(${n})">${x}</button>`).join('')}</div>`}function pick(n){ans[i]=n;render()}function esc(s){return s.replaceAll("'","\\'")}function hear(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=L==='B1'?.92:.86;speechSynthesis.speak(u)}function save(){let e=document.getElementById('txt');if(e)ans[i]=e.value}prev.onclick=()=>{save();if(i>0)i--;render()};next.onclick=()=>{save();if(i<tasks.length-1){i++;render();scrollTo({top:0,behavior:'smooth'})}else finish()};async function bindMic(){let b=document.getElementById('mic');const start=async e=>{e.preventDefault();try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType}),url=URL.createObjectURL(blob);audio.innerHTML=`<audio controls src="${url}" style="width:100%;margin-top:10px"></audio>`;ans[i]=true;stream.getTracks().forEach(t=>t.stop())};recorder.start();b.classList.add('rec');b.textContent='🔴 Sprich jetzt – loslassen zum Beenden'}catch{b.textContent='Mikrofon blockiert – Browser-Berechtigung erlauben'}};const stop=e=>{e.preventDefault();if(recorder&&recorder.state==='recording'){recorder.stop();b.classList.remove('rec');b.textContent='🎤 Gedrückt halten und erneut sprechen'}};b.onpointerdown=start;b.onpointerup=stop;b.onpointercancel=stop;b.onlostpointercapture=stop}function correct(q,type){if(type==='lesen'||type==='hoeren'||type==='grammatik')return q[4]}function finish(){save();clearInterval(clock);let total=0,ok=0;tasks.forEach((raw,n)=>{let type=S,q=raw;if(S==='pruefung'){type=q[0].toLowerCase();q=q.slice(1)}if(['lesen','hoeren','grammatik'].includes(type)){total++;if(ans[n]===correct(q,type))ok++}});let pct=total?Math.round(ok/total*100):0;task.classList.add('hidden');document.querySelector('.controls').classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<span class="tag">Ergebnis · ${L}</span><h2>Training beendet</h2>${total?`<div class="score">${pct}%</div><p><b>${ok} von ${total}</b> automatisch bewerteten Aufgaben richtig.</p>`:'<div class="score">✓</div><p>Du hast das Modul abgeschlossen.</p>'}<p class="note">Offene Schreib- und Sprechaufgaben werden nicht automatisch benotet. Prüfe, ob du alle Leitpunkte erfüllt hast.</p><a class="btn" href="?level=${L}&skill=${S}">Neu starten</a> <a class="btn alt" href="telc-training.html">Übersicht</a>`}let clock;if(left){timer.textContent=Math.floor(left/60)+':00';clock=setInterval(()=>{left--;timer.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0)finish()},1000)}else timer.textContent='';render();
</script></body></html>
