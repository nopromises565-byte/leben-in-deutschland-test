<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 Schreiben – Test in Deutschland</title><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2;--gold:#d7a72f}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font-family:Arial,sans-serif}.top{background:#fff;border-bottom:1px solid #e5ece8}.wrap{max-width:900px;margin:auto;padding:0 18px}.nav{min-height:60px;display:flex;align-items:center}.brand,.back{font-weight:950;color:var(--ink);text-decoration:none}.back{margin-left:auto;color:var(--g)}.hero{background:linear-gradient(105deg,#066846,#159465);color:#fff;padding:28px 0}.hero h1{margin:0;font-size:2rem}.hero p{margin:7px 0 0;font-weight:700;line-height:1.4}.progress{margin:18px 0 10px;font-weight:900}.bar{height:10px;background:#dce9e3;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);transition:.3s}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #0b56300b}.tag{display:inline-block;background:#e9f7f0;color:var(--g);font-weight:900;border-radius:999px;padding:6px 10px;font-size:.78rem}.card h2{margin:12px 0 7px}.task{background:#f3f8f5;border-left:4px solid var(--g);padding:14px;border-radius:12px;line-height:1.55}.points{margin:13px 0;padding-left:22px;line-height:1.7}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;border:2px solid #d9e6e0;border-radius:12px;padding:12px;font:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:var(--g)}textarea{min-height:150px;resize:vertical}.count{font-size:.78rem;color:#687a72;text-align:right}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;background:var(--g);color:#fff}.btn.alt{background:#fff;color:var(--g);border:2px solid var(--g);padding:9px 13px}.feedback{display:none;margin-top:14px;border-radius:13px;padding:13px;font-weight:800;line-height:1.45}.feedback.show{display:block}.feedback.ok{background:#e7f7ef;color:#075d3f}.feedback.warn{background:#fff5da;color:#725300}.example{display:none;margin-top:14px;background:#fff9e9;border:1px solid #f0d98e;border-radius:14px;padding:14px;line-height:1.6}.example.show{display:block}.navtasks{display:flex;justify-content:space-between;align-items:center;margin:16px 0 30px}.result{text-align:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0 30px}.result strong{font-size:2rem;color:var(--g)}@media(max-width:600px){.wrap{padding:0 12px}.hero h1{font-size:1.65rem}.card{padding:16px;border-radius:18px}.brand,.back{font-size:.9rem}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Test in Deutschland</a><a class="back" href="telc-training.html">← A1 Training</a></div></header><section class="hero"><div class="wrap"><h1>✍️ A1 Schreiben</h1><p>Kurze Nachrichten, Formulare und einfache E-Mails aus dem Alltag üben.</p></div></section><main class="wrap"><div class="progress"><span id="progressText">Aufgabe 1 von 12</span><div class="bar"><i id="bar"></i></div></div><section class="card" id="card"></section><div class="navtasks"><button class="btn alt" id="prev">← Zurück</button><button class="btn" id="next">Weiter →</button></div><section class="result" id="result" hidden><h2>Training geschafft 🎉</h2><p>Du hast alle 12 Schreibaufgaben angesehen.</p><strong id="doneCount">0/12</strong><p>Du kannst jede Aufgabe wiederholen und deine Texte verbessern.</p><button class="btn" onclick="restart()">Nochmal üben</button></section></main><script>const tasks=[{type:'Nachricht',title:'Du kommst später',situation:'Du möchtest deinen Freund Amir treffen. Du kommst 30 Minuten später.',points:['Entschuldige dich.','Schreibe, warum du später kommst.','Schreibe, wann du da bist.'],placeholder:'Hallo Amir, ...',keys:['entschuld','später','uhr'],example:'Hallo Amir, entschuldige bitte. Mein Bus hat Verspätung. Ich bin um 18:30 Uhr da. Bis gleich!'}, {type:'E-Mail',title:'Termin beim Arzt',situation:'Du kannst morgen nicht zu deinem Arzttermin kommen. Schreibe an die Praxis.',points:['Sage den Termin ab.','Nenne einen kurzen Grund.','Bitte um einen neuen Termin.'],placeholder:'Guten Tag, ...',keys:['termin','nicht','neu'],example:'Guten Tag, leider kann ich morgen nicht zu meinem Termin kommen, weil ich arbeiten muss. Können Sie mir bitte einen neuen Termin geben? Vielen Dank.'}, {type:'Formular',title:'Sprachkurs anmelden',situation:'Du möchtest dich für einen Deutschkurs anmelden.',form:true,fields:['Vorname und Nachname','Geburtsdatum','Telefonnummer','Gewünschter Kurs'],example:'Beispiel: Sara Hassan · 12.05.1998 · 0151 2345678 · Deutsch A1'}, {type:'Nachricht',title:'Geburtstag',situation:'Deine Freundin Lena hat Geburtstag. Du kannst nicht zu ihrer Feier kommen.',points:['Gratuliere Lena.','Sage, dass du nicht kommen kannst.','Schlage ein anderes Treffen vor.'],placeholder:'Liebe Lena, ...',keys:['geburtstag','nicht','treffen'],example:'Liebe Lena, alles Gute zum Geburtstag! Leider kann ich heute nicht kommen. Hast du am Samstag Zeit? Dann können wir uns treffen. Liebe Grüße'}, {type:'E-Mail',title:'Wohnung besichtigen',situation:'Du hast eine Wohnungsanzeige gesehen und möchtest die Wohnung besichtigen.',points:['Zeige dein Interesse.','Frage nach einem Termin.','Frage nach der Adresse.'],placeholder:'Guten Tag, ...',keys:['wohnung','termin','adresse'],example:'Guten Tag, ich interessiere mich für Ihre Wohnung. Wann kann ich die Wohnung besichtigen? Können Sie mir bitte die Adresse schicken? Freundliche Grüße'}, {type:'Nachricht',title:'Einkaufen',situation:'Du bist im Supermarkt. Schreibe deinem Partner eine kurze Nachricht.',points:['Frage, ob noch etwas gebraucht wird.','Sage, was du schon gekauft hast.','Sage, wann du nach Hause kommst.'],placeholder:'Hallo, ...',keys:['brauch','gekauft','uhr'],example:'Hallo, brauchst du noch etwas? Ich habe Brot, Milch und Gemüse gekauft. Ich bin gegen 17 Uhr zu Hause.'}, {type:'Formular',title:'Bibliotheksausweis',situation:'Du möchtest einen Ausweis für die Stadtbibliothek beantragen.',form:true,fields:['Name','Straße und Hausnummer','Postleitzahl und Ort','E-Mail-Adresse'],example:'Beispiel: Omar Ali · Hauptstraße 12 · 30159 Hannover · omar@example.de'}, {type:'E-Mail',title:'Deutschunterricht',situation:'Du möchtest Informationen über einen A1-Deutschkurs bekommen.',points:['Frage nach dem Kursbeginn.','Frage nach dem Preis.','Frage nach den Unterrichtszeiten.'],placeholder:'Guten Tag, ...',keys:['beginn','preis','uhr'],example:'Guten Tag, ich interessiere mich für Ihren A1-Deutschkurs. Wann beginnt der Kurs? Wie viel kostet er? Zu welchen Zeiten ist der Unterricht? Vielen Dank.'}, {type:'Nachricht',title:'Kind abholen',situation:'Du kannst dein Kind heute nicht selbst abholen. Schreibe einer bekannten Person.',points:['Bitte um Hilfe.','Sage, wo das Kind abgeholt werden soll.','Nenne die Uhrzeit.'],placeholder:'Hallo, ...',keys:['bitte','abhol','uhr'],example:'Hallo, kannst du bitte heute meinen Sohn von der Schule abholen? Die Schule ist in der Gartenstraße. Er hat um 13:30 Uhr Schluss. Vielen Dank!'}, {type:'E-Mail',title:'Hotel reservieren',situation:'Du möchtest für ein Wochenende ein Hotelzimmer reservieren.',points:['Nenne das Datum.','Frage nach einem Doppelzimmer.','Frage nach dem Preis.'],placeholder:'Guten Tag, ...',keys:['datum','zimmer','preis'],example:'Guten Tag, ich möchte vom 10. bis 12. Mai ein Zimmer reservieren. Haben Sie ein Doppelzimmer frei? Wie viel kostet das Zimmer pro Nacht? Freundliche Grüße'}, {type:'Nachricht',title:'Krank bei der Arbeit',situation:'Du bist krank und kannst heute nicht zur Arbeit kommen.',points:['Sage, dass du krank bist.','Sage, dass du heute nicht kommst.','Sage, wann du dich wieder meldest.'],placeholder:'Guten Morgen, ...',keys:['krank','nicht','meld'],example:'Guten Morgen, ich bin leider krank und kann heute nicht zur Arbeit kommen. Ich melde mich morgen wieder. Viele Grüße'}, {type:'E-Mail',title:'Fahrrad kaufen',situation:'Du hast online ein gebrauchtes Fahrrad gesehen und möchtest mehr wissen.',points:['Frage, ob das Fahrrad noch da ist.','Frage nach dem Zustand.','Bitte um einen Termin zum Anschauen.'],placeholder:'Hallo, ...',keys:['fahrrad','zustand','termin'],example:'Hallo, ist das Fahrrad noch zu haben? Ist es in gutem Zustand? Ich möchte es gern ansehen. Wann haben Sie Zeit? Viele Grüße'}];let index=0;const completed=new Set();const card=document.getElementById('card');function render(){const t=tasks[index];document.getElementById('progressText').textContent=`Aufgabe ${index+1} von ${tasks.length}`;document.getElementById('bar').style.width=((index+1)/tasks.length*100)+'%';let html=`<span class="tag">${t.type} · A1</span><h2>${t.title}</h2><div class="task">${t.situation}</div>`;if(t.form){html+='<div id="formFields">'+t.fields.map((f,i)=>`<div class="field"><label>${f}</label><input id="f${i}" autocomplete="off"></div>`).join('')+'</div>'}else{html+=`<p><b>Schreibe zu diesen Punkten:</b></p><ul class="points">${t.points.map(p=>`<li>${p}</li>`).join('')}</ul><div class="field"><label>Dein Text</label><textarea id="answer" maxlength="600" placeholder="${t.placeholder}"></textarea><div class="count"><span id="chars">0</span> Zeichen</div></div>`}html+=`<div class="actions"><button class="btn" onclick="check()">✓ Prüfen</button><button class="btn alt" onclick="showExample()">Musterlösung anzeigen</button></div><div class="feedback" id="feedback"></div><div class="example" id="example"><b>Eine mögliche Lösung:</b><br>${t.example}</div>`;card.innerHTML=html;if(!t.form){document.getElementById('answer').addEventListener('input',e=>document.getElementById('chars').textContent=e.target.value.length)}document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===tasks.length-1?'Ergebnis →':'Weiter →'}function check(){const t=tasks[index];const fb=document.getElementById('feedback');let ok=0;if(t.form){t.fields.forEach((_,i)=>{if((document.getElementById('f'+i).value||'').trim().length>1)ok++});fb.textContent=ok===t.fields.length?'Sehr gut! Du hast alle Felder ausgefüllt.':'Fülle noch alle Felder aus.';fb.className='feedback show '+(ok===t.fields.length?'ok':'warn')}else{const a=(document.getElementById('answer').value||'').toLowerCase().trim();if(a.length>=35)ok++;t.keys.forEach(k=>{if(a.includes(k))ok++});if(ok>=3){fb.textContent='Gut gemacht! Dein Text behandelt die wichtigen Punkte. Vergleiche ihn jetzt mit der Musterlösung.';fb.className='feedback show ok'}else{fb.textContent='Noch nicht ganz. Schreibe etwas mehr und achte darauf, alle drei Punkte zu beantworten.';fb.className='feedback show warn'}}completed.add(index);document.getElementById('doneCount').textContent=completed.size+'/'+tasks.length}function showExample(){document.getElementById('example').classList.add('show');completed.add(index)}document.getElementById('prev').onclick=()=>{if(index>0){index--;render();scrollTo({top:120,behavior:'smooth'})}};document.getElementById('next').onclick=()=>{completed.add(index);if(index<tasks.length-1){index++;render();scrollTo({top:120,behavior:'smooth'})}else{card.hidden=true;document.querySelector('.navtasks').hidden=true;document.getElementById('result').hidden=false;document.getElementById('doneCount').textContent=completed.size+'/'+tasks.length}};function restart(){index=0;completed.clear();card.hidden=false;document.querySelector('.navtasks').hidden=false;document.getElementById('result').hidden=true;render()}render();</script></body></html>
