<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fragen verwalten</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="admin.html">← Admin-Dashboard</a><nav><a href="index.html">Start</a><a href="admin.html">Admin</a></nav></div></header><main class="wrap auth-page"><section class="auth-hero"><span class="eyebrow">Admin</span><h1>Fragen</h1><p id="sectionStatus">Berechtigung wird geprüft …</p></section><section id="sectionContent" class="hidden"><div class="panel dashboard-card"><div class="admin-toolbar"><div><h2>Fragenverwaltung</h2><p id="questionsStatus">Bereit.</p></div><button id="importQuestions" class="btn primary">Fragenkatalog importieren</button></div><input id="questionSearch" class="admin-search" type="search" placeholder="Frage, Nummer oder Bundesland suchen …"></div><section class="admin-editor-layout"><div class="panel admin-question-list" id="questionList"><p>Noch keine Fragen geladen.</p></div><div class="panel dashboard-card"><form id="questionForm"><div id="questionEditor" class="hidden"><h2>Frage bearbeiten</h2><div class="admin-form-grid"><label>Frage-ID<input id="editId" disabled></label><label>Bundesland<input id="editState" disabled></label></div><label>Frage<textarea id="editQuestion" rows="3" required></textarea></label><div class="admin-form-grid"><label>Antwort A<input id="editA" required></label><label>Antwort B<input id="editB" required></label><label>Antwort C<input id="editC" required></label><label>Antwort D<input id="editD" required></label></div><label>Richtige Antwort<select id="editCorrect"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label><div class="editor-language-tabs" role="tablist" aria-label="Sprache auswählen"><button type="button" class="editor-language-tab active" data-lang-tab="de" role="tab" aria-selected="true">🇩🇪 Deutsch</button><button type="button" class="editor-language-tab" data-lang-tab="ar" role="tab" aria-selected="false">🇸🇦 Arabisch</button><button type="button" class="editor-language-tab" data-lang-tab="ku" role="tab" aria-selected="false">☀️ Kurdisch</button></div><div class="editor-language-panel" data-lang-panel="de"><h3>Erklärung</h3><label>Deutsch<textarea id="editExplanation" rows="4"></textarea></label><h3>Eselsbrücke</h3><label>Deutsch<textarea id="editMnemonic" rows="4"></textarea></label></div><div class="editor-language-panel hidden" data-lang-panel="ar" dir="rtl"><h3>الشرح</h3><label>Arabisch<textarea id="editExplanationAr" rows="4" dir="rtl"></textarea></label><h3>جسر التذكّر</h3><label>Arabisch<textarea id="editMnemonicAr" rows="4" dir="rtl"></textarea></label></div><div class="editor-language-panel hidden" data-lang-panel="ku"><h3>Şirove</h3><label>Kurdisch<textarea id="editExplanationKu" rows="4"></textarea></label><h3>Eselsbrücke</h3><label>Kurdisch<textarea id="editMnemonicKu" rows="4"></textarea></label></div><div class="question-actions"><span id="editorStatus" class="auth-note"></span><button class="btn primary" type="submit">Änderungen speichern</button></div></div></form></div></section></section></main><script src="auth.js"></script><script src="admin-section.js"></script><script src="admin-questions.js"></script><script>document.addEventListener('click',e=>{const tab=e.target.closest('[data-lang-tab]');if(!tab)return;const lang=tab.dataset.langTab;document.querySelectorAll('[data-lang-tab]').forEach(btn=>{const active=btn.dataset.langTab===lang;btn.classList.toggle('active',active);btn.setAttribute('aria-selected',String(active));});document.querySelectorAll('[data-lang-panel]').forEach(panel=>panel.classList.toggle('hidden',panel.dataset.langPanel!==lang));});initQuestionsAdmin();</script></body></html>
