<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 Hören – Prüfungstraining</title><style>:root{--g:#08784f;--ink:#10243b;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:0 14px}.top{background:#fff;border-bottom:1px solid #e5ece8}.nav{min-height:58px;display:flex;align-items:center;gap:12px}.brand{font-weight:950;color:var(--ink);text-decoration:none}.back{margin-left:auto;color:var(--g);font-weight:900;text-decoration:none}.hero{background:linear-gradient(105deg,#066846,#159465);color:#fff;padding:28px 0}.hero h1{margin:0;font-size:2rem}.hero p{margin:7px 0 0;font-weight:700}.progress{height:8px;background:#dfe9e4;border-radius:20px;overflow:hidden;margin:18px 0 8px}.bar{height:100%;background:var(--g);width:0;transition:.3s}.count{text-align:right;color:#66766f;font-size:.82rem;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 5px 18px #0b56300c}.tag{display:inline-block;background:#e9f6ef;color:var(--g);padding:6px 10px;border-radius:20px;font-size:.75rem;font-weight:900}.listen{margin:16px 0;background:#f2f8f5;border-radius:16px;padding:18px;text-align:center}.play{border:0;background:var(--g);color:#fff;border-radius:999px;padding:13px 20px;font-weight:900;font-size:1rem;cursor:pointer}.plays{margin-top:8px;color:#64756d;font-size:.8rem;font-weight:700}.voice{margin-top:6px;color:#08784f;font-size:.78rem;font-weight:900}.card h2{font-size:1.25rem;margin:16px 0 10px}.answers{display:grid;gap:9px}.answer{width:100%;text-align:left;padding:13px 14px;border:2px solid #dfe8e4;border-radius:12px;background:#fff;font-size:.96rem;font-weight:750;color:var(--ink);cursor:pointer}.answer.ok{border-color:#159465;background:#edf9f3}.answer.bad{border-color:#d45b5b;background:#fff2f2}.feedback{min-height:28px;margin:12px 0 4px;font-weight:900}.next{display:none;width:100%;border:0;border-radius:12px;padding:13px;background:var(--g);color:#fff;font-size:1rem;font-weight:900;cursor:pointer}.result{text-align:center}.score{font-size:3rem;font-weight:950;color:var(--g);margin:10px}.small{color:#66766f}.restart{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;background:var(--g);color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.hero{padding:22px 0}.hero h1{font-size:1.65rem}.card{padding:15px;border-radius:17px}.answer{font-size:.9rem;padding:12px}.listen{padding:15px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="telc-training.html">🎧 A1 Training</a><a class="back" href="telc-training.html">← Übersicht</a></div></header><section class="hero"><div class="wrap"><h1>🎧 A1 · Hören</h1><p>Kurze Gespräche, Ansagen und wichtige Informationen verstehen.</p></div></section><main class="wrap"><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div><section id="card" class="card"></section></main><script>const tasks=[{t:'Bahnhof',x:'Achtung auf Gleis drei. Der Zug nach Hannover fährt heute zehn Minuten später ab.',q:'Was ist richtig?',a:['Der Zug fällt aus.','Der Zug hat zehn Minuten Verspätung.','Der Zug fährt von Gleis zehn.'],c:1,v:'f'},{t:'Telefon',x:'Hallo Sara, hier ist Nina. Ich komme heute um halb sechs zu dir. Ich bringe auch einen Kuchen mit.',q:'Wann kommt Nina?',a:['Um 5:00 Uhr','Um 5:30 Uhr','Um 6:30 Uhr'],c:1,v:'f'},{t:'Supermarkt',x:'Liebe Kundinnen und Kunden, heute schließen wir bereits um achtzehn Uhr. Morgen sind wir wieder ab acht Uhr für Sie da.',q:'Wann schließt der Supermarkt heute?',a:['Um 8 Uhr','Um 18 Uhr','Um 20 Uhr'],c:1,v:'m'},{t:'Arztpraxis',x:'Guten Tag, Herr Yilmaz. Ihr Termin bei Frau Doktor Berger ist am Donnerstag um neun Uhr fünfzehn.',q:'Wann ist der Termin?',a:['Donnerstag 9:15 Uhr','Dienstag 9:15 Uhr','Donnerstag 19:15 Uhr'],c:0,v:'f'},{t:'Café',x:'Ich nehme einen Kaffee und ein Stück Apfelkuchen, bitte. Meine Freundin möchte nur einen Tee.',q:'Was möchte die Freundin?',a:['Kaffee','Apfelkuchen','Tee'],c:2,v:'m'},{t:'Bus',x:'Der Bus Nummer vierundzwanzig zum Hauptbahnhof kommt in fünf Minuten. Bitte halten Sie Ihre Fahrkarte bereit.',q:'Wohin fährt der Bus?',a:['Zum Flughafen','Zum Hauptbahnhof','Zum Krankenhaus'],c:1,v:'f'},{t:'Wetter',x:'Morgen bleibt es am Vormittag trocken. Am Nachmittag gibt es Regen. Die Temperatur liegt bei zwölf Grad.',q:'Wann regnet es?',a:['Am Vormittag','Am Nachmittag','In der Nacht'],c:1,v:'m'},{t:'Nachricht',x:'Hallo Mama, ich bin noch in der Schule. Der Unterricht endet heute erst um vierzehn Uhr dreißig. Danach fahre ich direkt nach Hause.',q:'Wann endet der Unterricht?',a:['13:30 Uhr','14:00 Uhr','14:30 Uhr'],c:2,v:'f'},{t:'Geschäft',x:'Guten Morgen. Das blaue Hemd kostet neunundzwanzig Euro. Das weiße Hemd ist heute im Angebot und kostet nur neunzehn Euro.',q:'Was kostet das weiße Hemd?',a:['19 Euro','29 Euro','39 Euro'],c:0,v:'m'},{t:'Flughafen',x:'Letzter Aufruf für Frau Klein. Bitte kommen Sie sofort zum Ausgang B zwölf. Ihr Flug nach Berlin ist bereit zum Einsteigen.',q:'Wohin soll Frau Klein gehen?',a:['Zum Ausgang B12','Zum Ausgang A2','Zum Bahnhof'],c:0,v:'f'},{t:'Wohnung',x:'Die Wohnung hat zwei Zimmer, eine Küche und einen kleinen Balkon. Sie kostet sechshundertfünfzig Euro im Monat.',q:'Wie viele Zimmer hat die Wohnung?',a:['Ein Zimmer','Zwei Zimmer','Drei Zimmer'],c:1,v:'m'},{t:'Treffen',x:'Treffen wir uns um sieben vor dem Kino? Nein, das ist mir zu früh. Lass uns um halb acht treffen.',q:'Wann treffen sie sich?',a:['19:00 Uhr','19:30 Uhr','20:30 Uhr'],c:1,v:'f'},{t:'Apotheke',x:'Nehmen Sie die Tabletten bitte zweimal täglich, morgens und abends, immer nach dem Essen.',q:'Wie oft soll man die Tabletten nehmen?',a:['Einmal täglich','Zweimal täglich','Dreimal täglich'],c:1,v:'m'},{t:'Schule',x:'Liebe Eltern, das Schulfest beginnt am Samstag um elf Uhr und endet um sechzehn Uhr. Bitte bringen Sie keine Getränke mit.',q:'An welchem Tag ist das Schulfest?',a:['Freitag','Samstag','Sonntag'],c:1,v:'f'},{t:'Restaurant',x:'Heute empfehlen wir unsere Gemüsesuppe für sechs Euro und das Hähnchen mit Reis für zwölf Euro.',q:'Wie viel kostet das Hähnchen mit Reis?',a:['6 Euro','10 Euro','12 Euro'],c:2,v:'m'},{t:'Arbeit',x:'Morgen beginnt die Besprechung nicht um neun, sondern schon um acht Uhr dreißig im großen Konferenzraum.',q:'Wann beginnt die Besprechung?',a:['8:30 Uhr','9:00 Uhr','9:30 Uhr'],c:0,v:'f'},{t:'Freizeit',x:'Am Sonntag wollen wir Fahrrad fahren. Wenn es regnet, gehen wir stattdessen ins Schwimmbad.',q:'Was machen sie bei Regen?',a:['Sie fahren Fahrrad.','Sie gehen ins Schwimmbad.','Sie bleiben zu Hause.'],c:1,v:'m'},{t:'Paket',x:'Guten Tag. Ihr Paket konnte heute nicht zugestellt werden. Sie können es ab morgen in der Postfiliale am Markt abholen.',q:'Ab wann kann man das Paket abholen?',a:['Heute','Ab morgen','Nächste Woche'],c:1,v:'f'}];let i=0,points=0,locked=false,spoken=0,voices=[];const card=document.getElementById('card'),bar=document.getElementById('bar'),count=document.getElementById('count');function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^de(-|_)/i.test(v.lang)||/german|deutsch/i.test(v.name))}loadVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadVoices;function voiceFor(kind){loadVoices();let femaleHints=/anna|katja|petra|vicki|helena|marlene|amala|female|frau/i,maleHints=/markus|hans|yannick|conrad|male|mann/i;let wanted=voices.filter(v=>kind==='f'?femaleHints.test(v.name):maleHints.test(v.name));if(wanted.length)return wanted[0];if(voices.length>1)return voices[kind==='f'?0:Math.min(1,voices.length-1)];return voices[0]||null}function render(){speechSynthesis.cancel();locked=false;spoken=0;let o=tasks[i];bar.style.width=(i/tasks.length*100)+'%';count.textContent='Aufgabe '+(i+1)+' von '+tasks.length;card.innerHTML='<span class="tag">'+o.t+'</span><div class="listen"><button id="play" class="play">🔊 Anhören</button><div id="plays" class="plays">Du kannst den Text mehrmals anhören.</div><div class="voice">'+(o.v==='f'?'👩 Weibliche Stimme':'👨 Männliche Stimme')+'</div></div><h2>'+o.q+'</h2><div class="answers">'+o.a.map((v,n)=>'<button class="answer" data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join('')+'</div><div id="fb" class="feedback"></div><button id="next" class="next">Weiter →</button>';document.getElementById('play').onclick=play;card.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(+b.dataset.n));document.getElementById('next').onclick=next}function play(){speechSynthesis.cancel();let o=tasks[i],u=new SpeechSynthesisUtterance(o.x),v=voiceFor(o.v);u.lang='de-DE';if(v)u.voice=v;u.rate=.82;u.pitch=o.v==='f'?1.02:.94;u.volume=1;speechSynthesis.speak(u);spoken++;document.getElementById('plays').textContent='Angehört: '+spoken+'×'}function choose(n){if(locked)return;locked=true;speechSynthesis.cancel();let o=tasks[i],buttons=card.querySelectorAll('.answer');buttons[o.c].classList.add('ok');if(n===o.c){points++;document.getElementById('fb').textContent='✅ Richtig!'}else{buttons[n].classList.add('bad');document.getElementById('fb').textContent='❌ Nicht richtig. Die grüne Antwort ist richtig.'}document.getElementById('next').style.display='block'}function next(){i++;if(i<tasks.length)render();else finish()}function finish(){speechSynthesis.cancel();bar.style.width='100%';count.textContent='Training abgeschlossen';let pct=Math.round(points/tasks.length*100);card.innerHTML='<div class="result"><div style="font-size:3rem">🎧</div><h2>A1 Hören abgeschlossen</h2><div class="score">'+points+' / '+tasks.length+'</div><p><b>'+pct+' % richtig</b></p><p class="small">Du hast weibliche und männliche Stimmen, Ansagen, Gespräche, Termine, Uhrzeiten und Alltagssituationen trainiert.</p><a class="restart" href="a1-hoeren.html">Noch einmal üben</a></div>'}render();</script></body></html>
